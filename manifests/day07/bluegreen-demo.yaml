apiVersion: v1
kind: ConfigMap
metadata:
  name: bluegreen-blue-html
data:
  index.html: "<h1>BLUE (v1.26)</h1>"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bluegreen-green-html
data:
  index.html: "<h1>GREEN (v1.27)</h1>"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bluegreen-demo
      version: blue
  template:
    metadata:
      labels:
        app: bluegreen-demo
        version: blue
    spec:
      containers:
        - name: web
          image: nginx:1.26
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: bluegreen-blue-html
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bluegreen-demo
      version: green
  template:
    metadata:
      labels:
        app: bluegreen-demo
        version: green
    spec:
      containers:
        - name: web
          image: nginx:1.27
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: bluegreen-green-html
---
apiVersion: v1
kind: Service
metadata:
  name: bluegreen-svc
spec:
  selector:
    app: bluegreen-demo
    version: blue
  ports:
    - port: 80
      targetPort: 80
