<svg width="700" height="520" viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>PV / PVC / StorageClass — 스토리지 추상화 계층</title>
  <desc>개발자가 PVC를 생성하면 PV에 바인딩되고, StorageClass는 PVC 요청 시 PV를 동적으로 프로비저닝한다. Pod가 삭제되어도 PVC/PV는 유지되어 데이터가 영속된다.</desc>

  <rect x="0" y="0" width="700" height="520" fill="#FFFFFF"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A16207" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Developer layer -->
  <rect x="220" y="20" width="160" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="300" y="47" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">개발자 (kubectl apply)</text>

  <!-- Arrow: Developer -> PVC -->
  <line x1="300" y1="64" x2="300" y2="95" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="316" y="84" font-size="11" fill="#5F5E5A">PVC 생성</text>

  <!-- PVC box -->
  <rect x="170" y="100" width="260" height="70" rx="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.2"/>
  <text x="300" y="123" text-anchor="middle" font-size="14" font-weight="600" fill="#0D47A1">PVC (PersistentVolumeClaim)</text>
  <text x="300" y="145" text-anchor="middle" font-size="12" fill="#0D47A1">요청서: 1Gi, ReadWriteOnce</text>
  <text x="300" y="161" text-anchor="middle" font-size="11" fill="#1A73E8">storageClassName: standard</text>

  <!-- Arrow: PVC <-> PV (binding) -->
  <line x1="300" y1="170" x2="300" y2="228" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow-green)" marker-start="url(#arrow-green)"/>
  <rect x="258" y="188" width="84" height="22" rx="4" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
  <text x="300" y="204" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">바인딩</text>

  <!-- PV box -->
  <rect x="170" y="232" width="260" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="300" y="255" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">PV (PersistentVolume)</text>
  <text x="300" y="277" text-anchor="middle" font-size="12" fill="#085041">실제 스토리지: 1Gi 할당</text>
  <text x="300" y="293" text-anchor="middle" font-size="11" fill="#0F6E56">reclaimPolicy: Retain</text>

  <!-- StorageClass box (side) -->
  <rect x="490" y="115" width="180" height="80" rx="10" fill="#FEF9C3" stroke="#A16207" stroke-width="1.2"/>
  <text x="580" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#713F12">StorageClass</text>
  <text x="580" y="160" text-anchor="middle" font-size="11" fill="#713F12">동적 프로비저닝 템플릿</text>
  <text x="580" y="177" text-anchor="middle" font-size="11" fill="#A16207">provisioner: k8s.io/...</text>

  <!-- Arrow: StorageClass -> PV -->
  <path d="M 580 195 L 580 267 L 434 267" fill="none" stroke="#A16207" stroke-width="1.2" marker-end="url(#arrow-yellow)"/>
  <text x="510" y="250" font-size="11" fill="#713F12">PVC 요청 시</text>
  <text x="510" y="264" font-size="11" fill="#713F12">자동 생성</text>

  <!-- Arrow: PV -> backends -->
  <line x1="300" y1="302" x2="300" y2="338" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Backend storage boxes -->
  <rect x="40" y="342" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="110" y="369" text-anchor="middle" font-size="12" fill="#2C2C2A">AWS EBS</text>

  <rect x="200" y="342" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="270" y="369" text-anchor="middle" font-size="12" fill="#2C2C2A">NFS</text>

  <rect x="360" y="342" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="430" y="369" text-anchor="middle" font-size="12" fill="#2C2C2A">hostPath</text>

  <rect x="520" y="342" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="590" y="369" text-anchor="middle" font-size="12" fill="#2C2C2A">Ceph / GCE PD 등</text>

  <!-- Connecting lines from PV to backends -->
  <line x1="230" y1="338" x2="110" y2="342" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="4 3"/>
  <line x1="270" y1="338" x2="270" y2="342" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="4 3"/>
  <line x1="330" y1="338" x2="430" y2="342" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="4 3"/>
  <line x1="370" y1="338" x2="590" y2="342" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="4 3"/>

  <!-- Key point box -->
  <rect x="80" y="420" width="540" height="75" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2" stroke-dasharray="6 3"/>
  <text x="350" y="448" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">Pod 삭제해도 PVC / PV는 유지 → 데이터 영속</text>
  <text x="350" y="470" text-anchor="middle" font-size="11" fill="#0F6E56">PVC = "나 이만큼 필요해" | PV = "여기 이만큼 있어" | StorageClass = "자동으로 만들어줄게"</text>
  <text x="350" y="487" text-anchor="middle" font-size="11" fill="#5F5E5A">Retain → PVC 삭제해도 PV 보존 / Delete → PVC 삭제 시 PV도 삭제</text>
</svg>