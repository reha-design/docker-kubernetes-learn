<svg width="700" height="500" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>DaemonSet — 노드당 정확히 1개씩</title>
  <desc>Deployment는 replicas 수만큼 Pod를 노드에 불균등하게 배치하지만, DaemonSet은 모든 노드에 정확히 1개씩 Pod를 배치한다. 새 노드가 추가되면 DaemonSet Pod도 자동으로 생성된다.</desc>

  <rect x="0" y="0" width="700" height="500" fill="#FFFFFF"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- === TOP HALF: Deployment === -->
  <rect x="30" y="15" width="640" height="195" rx="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.2"/>
  <text x="50" y="38" font-size="14" font-weight="600" fill="#0D47A1">Deployment (replicas: 3)</text>
  <text x="400" y="38" font-size="11" fill="#1A73E8">"총 3개를 어딘가에 배치" → 노드별 개수 불균등</text>

  <!-- Node 1 with 2 pods -->
  <rect x="55" y="55" width="170" height="140" rx="8" fill="#FFFFFF" stroke="#1A73E8" stroke-width="1"/>
  <text x="140" y="75" text-anchor="middle" font-size="12" font-weight="500" fill="#0D47A1">Node 1</text>
  <rect x="75" y="85" width="130" height="30" rx="6" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1"/>
  <text x="140" y="105" text-anchor="middle" font-size="11" fill="#0D47A1">Pod (nginx)</text>
  <rect x="75" y="122" width="130" height="30" rx="6" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1"/>
  <text x="140" y="142" text-anchor="middle" font-size="11" fill="#0D47A1">Pod (nginx)</text>
  <text x="140" y="178" text-anchor="middle" font-size="11" font-weight="500" fill="#1A73E8">2개</text>

  <!-- Node 2 with 1 pod -->
  <rect x="250" y="55" width="170" height="140" rx="8" fill="#FFFFFF" stroke="#1A73E8" stroke-width="1"/>
  <text x="335" y="75" text-anchor="middle" font-size="12" font-weight="500" fill="#0D47A1">Node 2</text>
  <rect x="270" y="85" width="130" height="30" rx="6" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1"/>
  <text x="335" y="105" text-anchor="middle" font-size="11" fill="#0D47A1">Pod (nginx)</text>
  <text x="335" y="178" text-anchor="middle" font-size="11" font-weight="500" fill="#1A73E8">1개</text>

  <!-- Node 3 with 0 pods -->
  <rect x="445" y="55" width="170" height="140" rx="8" fill="#FFFFFF" stroke="#1A73E8" stroke-width="1"/>
  <text x="530" y="75" text-anchor="middle" font-size="12" font-weight="500" fill="#0D47A1">Node 3</text>
  <text x="530" y="130" text-anchor="middle" font-size="12" fill="#B4B2A9">Pod 없음</text>
  <text x="530" y="178" text-anchor="middle" font-size="11" font-weight="500" fill="#1A73E8">0개</text>

  <!-- === VS divider === -->
  <text x="350" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#5F5E5A">vs</text>

  <!-- === BOTTOM HALF: DaemonSet === -->
  <rect x="30" y="245" width="640" height="195" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="50" y="268" font-size="14" font-weight="600" fill="#085041">DaemonSet</text>
  <text x="400" y="268" font-size="11" fill="#0F6E56">"모든 노드에 정확히 1개씩" → 균등 보장</text>

  <!-- Node 1 with 1 pod -->
  <rect x="55" y="282" width="130" height="110" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
  <text x="120" y="302" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">Node 1</text>
  <rect x="70" y="312" width="100" height="30" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="120" y="332" text-anchor="middle" font-size="11" fill="#085041">Pod</text>
  <text x="120" y="378" text-anchor="middle" font-size="11" font-weight="500" fill="#0F6E56">1개</text>

  <!-- Node 2 with 1 pod -->
  <rect x="200" y="282" width="130" height="110" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
  <text x="265" y="302" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">Node 2</text>
  <rect x="215" y="312" width="100" height="30" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="265" y="332" text-anchor="middle" font-size="11" fill="#085041">Pod</text>
  <text x="265" y="378" text-anchor="middle" font-size="11" font-weight="500" fill="#0F6E56">1개</text>

  <!-- Node 3 with 1 pod -->
  <rect x="345" y="282" width="130" height="110" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
  <text x="410" y="302" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">Node 3</text>
  <rect x="360" y="312" width="100" height="30" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="410" y="332" text-anchor="middle" font-size="11" fill="#085041">Pod</text>
  <text x="410" y="378" text-anchor="middle" font-size="11" font-weight="500" fill="#0F6E56">1개</text>

  <!-- Node 4 (new, dashed) with auto-added pod -->
  <rect x="490" y="282" width="155" height="110" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="567" y="302" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">Node 4 (신규)</text>
  <rect x="517" y="312" width="100" height="30" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="567" y="332" text-anchor="middle" font-size="11" fill="#085041">Pod</text>
  <text x="567" y="360" text-anchor="middle" font-size="10" fill="#0F6E56">자동 추가!</text>
  <text x="567" y="378" text-anchor="middle" font-size="11" font-weight="500" fill="#0F6E56">1개</text>

  <!-- Annotation -->
  <text x="350" y="225" text-anchor="middle" font-size="12" font-weight="500" fill="#2C2C2A">Deployment: 총 N개 / DaemonSet: 노드당 1개</text>

  <!-- Use cases box -->
  <rect x="60" y="455" width="580" height="32" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="350" y="476" text-anchor="middle" font-size="12" fill="#2C2C2A">대표 사용 사례: 로그 수집(Fluentd) | 모니터링(Node Exporter) | CNI(네트워크 플러그인)</text>
</svg>