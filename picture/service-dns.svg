<svg width="680" height="164" viewBox="0 0 680 164" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>Service를 이름으로 찾는 과정 — CoreDNS와 kube-proxy</title>
  <desc>Pod A가 my-service라는 이름으로 접속하면 CoreDNS가 ClusterIP로 해석하고, kube-proxy가 Ready 상태인 Pod B로 트래픽을 전달한다.</desc>
  <rect x="0" y="0" width="680" height="164" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="40" y="60" width="130" height="64" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="105" y="86" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Pod A</text>
  <text x="105" y="107" text-anchor="middle" font-size="12" fill="#5F5E5A">요청 보냄</text>
  <line x1="170" y1="92" x2="190" y2="92" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="190" y="60" width="130" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="255" y="86" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">CoreDNS</text>
  <text x="255" y="107" text-anchor="middle" font-size="12" fill="#0F6E56">이름→IP 해석</text>
  <line x1="320" y1="92" x2="340" y2="92" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="340" y="60" width="130" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="405" y="86" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">kube-proxy</text>
  <text x="405" y="107" text-anchor="middle" font-size="12" fill="#0F6E56">Ready 파드로 전달</text>
  <line x1="470" y1="92" x2="490" y2="92" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="490" y="60" width="130" height="64" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="555" y="86" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Pod B</text>
  <text x="555" y="107" text-anchor="middle" font-size="12" fill="#5F5E5A">응답 처리</text>
</svg>
