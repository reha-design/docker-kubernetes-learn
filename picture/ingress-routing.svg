<svg width="700" height="420" viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>Ingress — 경로 기반 L7 라우팅</title>
  <desc>외부 클라이언트의 요청이 Ingress Controller(nginx)를 통해 경로(/app1, /app2)에 따라 서로 다른 Service와 Pod로 라우팅되는 구조를 보여준다.</desc>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
  <defs>
    <marker id="arrowRoute" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowBl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1A73E8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#2C2C2A">Ingress — 경로 기반 L7 라우팅</text>

  <!-- Client (left) -->
  <rect x="20" y="155" width="100" height="60" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="70" y="182" text-anchor="middle" font-size="12" font-weight="500" fill="#2C2C2A">클라이언트</text>
  <text x="70" y="200" text-anchor="middle" font-size="10" fill="#5F5E5A">외부 요청</text>

  <!-- Arrow client → Ingress -->
  <line x1="120" y1="185" x2="175" y2="185" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrowRoute)"/>

  <!-- Ingress Controller (center, prominent) -->
  <rect x="180" y="110" width="180" height="150" rx="10" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="270" y="138" text-anchor="middle" font-size="13" font-weight="600" fill="#4C1D95">Ingress Controller</text>
  <text x="270" y="156" text-anchor="middle" font-size="11" fill="#7C3AED">(nginx)</text>

  <!-- Host label inside -->
  <rect x="198" y="168" width="144" height="24" rx="5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="0.8"/>
  <text x="270" y="185" text-anchor="middle" font-size="11" fill="#4C1D95">host: myapp.local</text>

  <!-- Path labels inside -->
  <rect x="198" y="200" width="66" height="22" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="231" y="215" text-anchor="middle" font-size="11" font-weight="500" fill="#085041">/app1</text>

  <rect x="276" y="200" width="66" height="22" rx="5" fill="#E8F0FE" stroke="#1A73E8" stroke-width="0.8"/>
  <text x="309" y="215" text-anchor="middle" font-size="11" font-weight="500" fill="#0D47A1">/app2</text>

  <!-- === /app1 path (GREEN, top) === -->
  <!-- Arrow from Ingress to Service A -->
  <line x1="360" y1="130" x2="418" y2="100" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrowGr)"/>
  <text x="380" y="100" font-size="10" fill="#0F6E56">/app1</text>

  <!-- Service A -->
  <rect x="420" y="68" width="130" height="55" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="485" y="90" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">Service A</text>
  <text x="485" y="108" text-anchor="middle" font-size="10" fill="#0F6E56">my-backend</text>

  <!-- Arrow Service A → Pod A -->
  <line x1="550" y1="95" x2="598" y2="95" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrowGr)"/>

  <!-- Pod A -->
  <rect x="600" y="68" width="80" height="55" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="640" y="90" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">Pod</text>
  <text x="640" y="108" text-anchor="middle" font-size="10" fill="#0F6E56">nginx</text>

  <!-- === /app2 path (BLUE, bottom) === -->
  <!-- Arrow from Ingress to Service B -->
  <line x1="360" y1="240" x2="418" y2="270" stroke="#1A73E8" stroke-width="1.5" marker-end="url(#arrowBl)"/>
  <text x="380" y="270" font-size="10" fill="#1A73E8">/app2</text>

  <!-- Service B -->
  <rect x="420" y="248" width="130" height="55" rx="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1"/>
  <text x="485" y="270" text-anchor="middle" font-size="12" font-weight="500" fill="#0D47A1">Service B</text>
  <text x="485" y="288" text-anchor="middle" font-size="10" fill="#1A73E8">my-app2</text>

  <!-- Arrow Service B → Pod B -->
  <line x1="550" y1="275" x2="598" y2="275" stroke="#1A73E8" stroke-width="1.5" marker-end="url(#arrowBl)"/>

  <!-- Pod B -->
  <rect x="600" y="248" width="80" height="55" rx="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1"/>
  <text x="640" y="270" text-anchor="middle" font-size="12" font-weight="500" fill="#0D47A1">Pod</text>
  <text x="640" y="288" text-anchor="middle" font-size="10" fill="#1A73E8">httpd</text>

  <!-- Key point at bottom -->
  <rect x="130" y="360" width="440" height="40" rx="10" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="350" y="385" text-anchor="middle" font-size="12" font-weight="600" fill="#4C1D95">같은 포트, 같은 Host → 경로만으로 라우팅 분기</text>
</svg>