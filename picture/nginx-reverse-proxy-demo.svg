<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>nginx 리버스 프록시 실습 구조 — 클라이언트는 프록시만 상대한다</title>
  <desc>클라이언트는 8082 포트로 노출된 nginx-proxy에만 접속하고, nginx-proxy가 proxy_pass로 backend-a에 요청을 넘긴다. backend-a는 호스트에 포트가 없어 docker network 밖에서는 직접 접근할 수 없다.</desc>
  <rect x="0" y="0" width="680" height="480" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="260" y="20" width="160" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="340" y="47" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">클라이언트 (curl)</text>

  <line x1="340" y1="64" x2="340" y2="136" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="352" y="104" font-size="12" fill="#5F5E5A">localhost:8082</text>

  <rect x="90" y="140" width="500" height="280" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="110" y="168" font-size="14" font-weight="500" fill="#444441">docker network: nginx-demo-net</text>
  <text x="110" y="188" font-size="12" fill="#5F5E5A">같은 네트워크 안에서는 컨테이너 이름으로 통신</text>

  <rect x="190" y="210" width="300" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="340" y="236" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">nginx-proxy</text>
  <text x="340" y="257" text-anchor="middle" font-size="12" fill="#0F6E56">8082:80 → 호스트에 노출된 유일한 문</text>

  <line x1="340" y1="274" x2="340" y2="316" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="352" y="299" font-size="12" fill="#5F5E5A">proxy_pass → backend-a:80</text>

  <rect x="190" y="320" width="300" height="64" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="340" y="346" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">backend-a</text>
  <text x="340" y="367" text-anchor="middle" font-size="12" fill="#993C1D">호스트 포트 없음</text>

  <text x="340" y="448" text-anchor="middle" font-size="12" font-weight="500" fill="#854F0B">backend-a는 호스트 포트가 없어 밖에서 직접 접근 불가</text>
  <text x="340" y="466" text-anchor="middle" font-size="12" fill="#854F0B">— nginx-proxy를 통해서만 도달 가능</text>
</svg>
