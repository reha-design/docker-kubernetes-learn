<svg width="680" height="390" viewBox="0 0 680 390" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>RBAC — Role와 RoleBinding 관계</title>
  <desc>day9-sa ServiceAccount가 RoleBinding의 subjects로 지정되고, RoleBinding이 roleRef로 pod-reader Role을 가리켜 권한이 연결된다. 이 구조는 day9-ns 네임스페이스 경계 안에서만 유효하다.</desc>

  <rect x="0" y="0" width="680" height="390" fill="#FFFFFF"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 네임스페이스 경계 -->
  <rect x="42" y="20" width="596" height="330" rx="12" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="58" y="42" font-size="13" fill="#5F5E5A">네임스페이스: day9-ns 안에서만 유효</text>

  <!-- ServiceAccount -->
  <rect x="250" y="60" width="180" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="340" y="83" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">ServiceAccount</text>
  <text x="340" y="103" text-anchor="middle" font-size="12" fill="#185FA5">day9-sa</text>

  <line x1="340" y1="116" x2="340" y2="156" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="352" y="140" font-size="12" fill="#5F5E5A">subjects로 지정</text>

  <!-- RoleBinding -->
  <rect x="225" y="160" width="230" height="56" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="340" y="183" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">RoleBinding</text>
  <text x="340" y="203" text-anchor="middle" font-size="11" fill="#5F5E5A">day9-sa-pod-reader-binding</text>

  <line x1="340" y1="216" x2="340" y2="256" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="352" y="240" font-size="12" fill="#5F5E5A">roleRef로 연결</text>

  <!-- Role -->
  <rect x="260" y="260" width="160" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="340" y="283" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Role</text>
  <text x="340" y="303" text-anchor="middle" font-size="12" fill="#0F6E56">pod-reader</text>

  <!-- 규칙 상세 -->
  <line x1="420" y1="288" x2="468" y2="288" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="468" y="253" width="150" height="76" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="480" y="275" font-size="11" fill="#444441">resources: pods</text>
  <text x="480" y="293" font-size="11" fill="#444441">verbs: get,</text>
  <text x="480" y="311" font-size="11" fill="#444441">list, watch</text>

  <!-- 범위 설명 -->
  <text x="58" y="368" font-size="12" fill="#5F5E5A">
    <tspan x="58" dy="0">→ default 등 다른 네임스페이스에는 이 권한이 적용되지 않는다</tspan>
    <tspan x="58" dy="18">(실습 확인: kubectl auth can-i ... -n default → no)</tspan>
  </text>
</svg>
