<svg width="680" height="376" viewBox="0 0 680 376" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>무중단 배포를 지키는 두 설정 — maxUnavailable과 readiness</title>
  <desc>새 버전 파드가 readiness를 통과하기 전까지 maxUnavailable 0 설정 덕분에 기존 버전 파드 3개가 계속 트래픽을 받는다.</desc>
  <rect x="0" y="0" width="680" height="376" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="230" y="30" width="220" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="340" y="53" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Service</text>
  <text x="340" y="73" text-anchor="middle" font-size="12" fill="#0F6E56">Ready 파드에게만 라우팅</text>

  <line x1="340" y1="86" x2="340" y2="126" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="352" y="112" font-size="12" fill="#5F5E5A">maxUnavailable: 0</text>

  <rect x="40" y="126" width="600" height="210" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="60" y="154" font-size="14" font-weight="500" fill="#444441">Deployment</text>
  <text x="60" y="174" font-size="12" fill="#5F5E5A">새 버전 배포 중 (rollout)</text>

  <rect x="60" y="190" width="120" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="120" y="216" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">v1.27</text>
  <text x="120" y="237" text-anchor="middle" font-size="12" fill="#0F6E56">Ready</text>

  <rect x="196" y="190" width="120" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="256" y="216" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">v1.27</text>
  <text x="256" y="237" text-anchor="middle" font-size="12" fill="#0F6E56">Ready</text>

  <rect x="332" y="190" width="120" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="392" y="216" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">v1.27</text>
  <text x="392" y="237" text-anchor="middle" font-size="12" fill="#0F6E56">Ready</text>

  <rect x="468" y="190" width="120" height="64" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="528" y="216" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">v1.28</text>
  <text x="528" y="237" text-anchor="middle" font-size="12" fill="#5F5E5A">대기 중</text>
</svg>
