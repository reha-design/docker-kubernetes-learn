<svg width="680" height="250" viewBox="0 0 680 250" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>Pod 시작 파이프라인 — 단계별 장애 유형</title>
  <desc>Pod는 스케줄링, 이미지 준비, 실행 중의 3단계를 거치며, 각 단계에서 막히면 Pending, ImagePullBackOff, CrashLoopBackOff/OOMKilled로 각각 다르게 나타난다.</desc>
  <rect x="0" y="0" width="680" height="250" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="30" font-size="14" font-weight="500" fill="#444441">Pod 시작 파이프라인 — 어디서 막혔는지가 장애 유형을 결정한다</text>

  <!-- Row 1: normal pipeline stages -->
  <rect x="40" y="50" width="175" height="64" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="128" y="76" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">스케줄링</text>
  <text x="128" y="97" text-anchor="middle" font-size="12" fill="#5F5E5A">노드에 배치 시도</text>
  <line x1="215" y1="82" x2="240" y2="82" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="240" y="50" width="175" height="64" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="328" y="76" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">이미지 준비</text>
  <text x="328" y="97" text-anchor="middle" font-size="12" fill="#5F5E5A">레지스트리에서 pull</text>
  <line x1="415" y1="82" x2="440" y2="82" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="440" y="50" width="175" height="64" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="528" y="76" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">실행 중</text>
  <text x="528" y="97" text-anchor="middle" font-size="12" fill="#5F5E5A">컨테이너 동작</text>

  <!-- vertical arrows down to failure states -->
  <line x1="128" y1="114" x2="128" y2="140" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="328" y1="114" x2="328" y2="140" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="528" y1="114" x2="528" y2="140" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 2: failure states -->
  <rect x="40" y="140" width="175" height="78" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="128" y="171" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Pending</text>
  <text x="128" y="192" text-anchor="middle" font-size="12" fill="#993C1D">Node: &lt;none&gt;</text>

  <rect x="240" y="140" width="175" height="78" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="328" y="171" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">ImagePullBackOff</text>
  <text x="328" y="192" text-anchor="middle" font-size="12" fill="#993C1D">RESTARTS 항상 0</text>

  <rect x="440" y="140" width="175" height="78" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="528" y="162" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">실행 중 실패</text>
  <text x="528" y="184" text-anchor="middle" font-size="12" fill="#993C1D">CrashLoopBackOff</text>
  <text x="528" y="204" text-anchor="middle" font-size="12" fill="#993C1D">OOMKilled</text>
</svg>
