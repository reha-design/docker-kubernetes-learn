<svg width="700" height="510" viewBox="0 0 700 510" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>Docker 네트워킹 — 4가지 모드 비교</title>
  <desc>Docker의 4가지 네트워크 모드(기본 bridge, 커스텀 bridge, host, none)를 비교한 다이어그램. 커스텀 bridge가 내장 DNS와 네트워크 격리를 제공하는 실무 표준이다.</desc>
  <rect x="0" y="0" width="700" height="510" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#2C2C2A">Docker 네트워킹 — 4가지 모드 비교</text>

  <!-- === Row 1: Bridge networks === -->

  <!-- 기본 bridge (Neutral/Gray) -->
  <rect x="15" y="50" width="325" height="210" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
  <text x="177" y="74" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">기본 bridge</text>

  <!-- docker0 bridge bar -->
  <rect x="50" y="90" width="255" height="28" rx="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
  <text x="177" y="109" text-anchor="middle" font-size="11" fill="#5F5E5A">docker0 브리지 (NAT)</text>

  <!-- Vertical lines from bridge to containers -->
  <line x1="115" y1="118" x2="115" y2="142" stroke="#5F5E5A" stroke-width="1.2"/>
  <line x1="240" y1="118" x2="240" y2="142" stroke="#5F5E5A" stroke-width="1.2"/>

  <!-- Container A -->
  <rect x="60" y="142" width="110" height="48" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
  <text x="115" y="162" text-anchor="middle" font-size="12" font-weight="500" fill="#2C2C2A">컨테이너 A</text>
  <text x="115" y="180" text-anchor="middle" font-size="10" fill="#5F5E5A">172.17.0.2</text>

  <!-- Container B -->
  <rect x="185" y="142" width="110" height="48" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
  <text x="240" y="162" text-anchor="middle" font-size="12" font-weight="500" fill="#2C2C2A">컨테이너 B</text>
  <text x="240" y="180" text-anchor="middle" font-size="10" fill="#5F5E5A">172.17.0.3</text>

  <!-- Description -->
  <text x="177" y="215" text-anchor="middle" font-size="11" fill="#5F5E5A">IP 통신만 가능, DNS 없음, -p 필요</text>
  <text x="177" y="248" text-anchor="middle" font-size="10" fill="#993C1D">컨테이너 이름으로 통신 불가</text>

  <!-- Dashed separation line (network isolation) -->
  <line x1="348" y1="50" x2="348" y2="260" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="348" y="270" text-anchor="middle" font-size="9" fill="#5F5E5A">네트워크 격리</text>

  <!-- 커스텀 bridge (Green) -->
  <rect x="362" y="50" width="325" height="210" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="524" y="74" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">커스텀 bridge (추천)</text>

  <!-- my-net bridge bar -->
  <rect x="397" y="90" width="255" height="28" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
  <text x="524" y="109" text-anchor="middle" font-size="11" fill="#0F6E56">my-net 브리지 + DNS (127.0.0.11)</text>

  <!-- Vertical lines -->
  <line x1="462" y1="118" x2="462" y2="142" stroke="#0F6E56" stroke-width="1.2"/>
  <line x1="587" y1="118" x2="587" y2="142" stroke="#0F6E56" stroke-width="1.2"/>

  <!-- Container app1 -->
  <rect x="407" y="142" width="110" height="48" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
  <text x="462" y="162" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">app1</text>
  <text x="462" y="180" text-anchor="middle" font-size="10" fill="#0F6E56">ping app2 가능</text>

  <!-- Container app2 -->
  <rect x="532" y="142" width="110" height="48" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
  <text x="587" y="162" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">app2</text>
  <text x="587" y="180" text-anchor="middle" font-size="10" fill="#0F6E56">ping app1 가능</text>

  <!-- Description -->
  <text x="524" y="215" text-anchor="middle" font-size="11" fill="#0F6E56">이름으로 통신 가능 + 네트워크 간 격리</text>
  <text x="524" y="248" text-anchor="middle" font-size="10" fill="#085041">서비스 디스커버리 내장</text>

  <!-- === Row 2 === -->

  <!-- host (Yellow) -->
  <rect x="15" y="290" width="325" height="140" rx="10" fill="#FEF9C3" stroke="#A16207" stroke-width="1.2"/>
  <text x="177" y="314" text-anchor="middle" font-size="14" font-weight="600" fill="#713F12">host</text>

  <!-- Host network stack -->
  <rect x="50" y="328" width="255" height="32" rx="6" fill="#FFFFFF" stroke="#A16207" stroke-width="1"/>
  <text x="177" y="349" text-anchor="middle" font-size="11" fill="#713F12">호스트 네트워크 스택 (eth0, lo ...)</text>

  <!-- Container directly in host (dashed = no boundary) -->
  <rect x="110" y="370" width="135" height="28" rx="6" fill="#FEF9C3" stroke="#A16207" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="177" y="389" text-anchor="middle" font-size="11" fill="#713F12">컨테이너 (격리 없음)</text>

  <!-- Description -->
  <text x="177" y="420" text-anchor="middle" font-size="11" fill="#A16207">호스트 네트워크 그대로, -p 무시, 격리 없음</text>

  <!-- none (Red/Orange) -->
  <rect x="362" y="290" width="325" height="140" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/>
  <text x="524" y="314" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">none</text>

  <!-- Isolated container -->
  <rect x="455" y="328" width="140" height="45" rx="8" fill="#FFFFFF" stroke="#993C1D" stroke-width="1"/>
  <text x="525" y="348" text-anchor="middle" font-size="12" font-weight="500" fill="#712B13">컨테이너</text>
  <text x="525" y="365" text-anchor="middle" font-size="10" fill="#993C1D">lo (127.0.0.1)만 존재</text>

  <!-- X marks for no network -->
  <line x1="415" y1="342" x2="445" y2="342" stroke="#993C1D" stroke-width="1.5"/>
  <line x1="415" y1="358" x2="445" y2="358" stroke="#993C1D" stroke-width="1.5"/>
  <line x1="605" y1="342" x2="635" y2="342" stroke="#993C1D" stroke-width="1.5"/>
  <line x1="605" y1="358" x2="635" y2="358" stroke="#993C1D" stroke-width="1.5"/>

  <!-- Description -->
  <text x="524" y="400" text-anchor="middle" font-size="11" fill="#993C1D">네트워크 없음, 완전 격리</text>
  <text x="524" y="420" text-anchor="middle" font-size="10" fill="#712B13">보안 목적의 오프라인 작업 전용</text>

  <!-- Key point -->
  <rect x="100" y="455" width="500" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="350" y="478" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">커스텀 네트워크 = 내장 DNS + 격리 = 실무 표준</text>
</svg>