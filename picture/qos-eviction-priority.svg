<svg width="700" height="490" viewBox="0 0 700 490" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>QoS 클래스 — 자원 선언이 곧 생존 순위</title>
  <desc>Kubernetes QoS 클래스의 축출 우선순위를 보여주는 다이어그램. BestEffort가 가장 먼저, Guaranteed가 가장 마지막에 축출된다. 정직하게 자원을 선언할수록 보호받는 인센티브 구조다.</desc>
  <rect x="0" y="0" width="700" height="490" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#2C2C2A">QoS 클래스 — 자원 선언이 곧 생존 순위</text>

  <!-- Left arrow: eviction order -->
  <text x="55" y="68" text-anchor="middle" font-size="11" font-weight="500" fill="#5F5E5A">메모리 압박 시</text>
  <text x="55" y="83" text-anchor="middle" font-size="11" font-weight="500" fill="#5F5E5A">축출 순서</text>
  <text x="55" y="100" text-anchor="middle" font-size="10" font-weight="600" fill="#993C1D">먼저</text>
  <line x1="55" y1="106" x2="55" y2="390" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="55" y="410" text-anchor="middle" font-size="10" font-weight="600" fill="#0F6E56">보호됨</text>

  <!-- Tier 1: BestEffort (Red) - evicted first -->
  <rect x="100" y="55" width="580" height="95" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
  <text x="125" y="82" font-size="14" font-weight="600" fill="#712B13">BestEffort</text>
  <text x="125" y="102" font-size="12" fill="#993C1D">조건: requests/limits 없음</text>
  <text x="125" y="122" font-size="12" fill="#993C1D">결과: 가장 먼저 축출</text>
  <rect x="545" y="72" width="115" height="28" rx="6" fill="#993C1D"/>
  <text x="602" y="91" text-anchor="middle" font-size="11" font-weight="500" fill="#FFFFFF">최우선 축출</text>

  <!-- Connecting dash -->
  <line x1="390" y1="150" x2="390" y2="172" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Tier 2: Burstable (Yellow) - middle -->
  <rect x="100" y="172" width="580" height="95" rx="10" fill="#FEF9C3" stroke="#A16207" stroke-width="1.5"/>
  <text x="125" y="199" font-size="14" font-weight="600" fill="#713F12">Burstable</text>
  <text x="125" y="219" font-size="12" fill="#A16207">조건: requests &lt; limits (일부 설정)</text>
  <text x="125" y="239" font-size="12" fill="#A16207">결과: requests 초과 사용량이 클수록 먼저</text>
  <rect x="545" y="189" width="115" height="28" rx="6" fill="#A16207"/>
  <text x="602" y="208" text-anchor="middle" font-size="11" font-weight="500" fill="#FFFFFF">상황에 따라</text>

  <!-- Connecting dash -->
  <line x1="390" y1="267" x2="390" y2="290" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Tier 3: Guaranteed (Green) - last evicted -->
  <rect x="100" y="290" width="580" height="95" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="125" y="317" font-size="14" font-weight="600" fill="#085041">Guaranteed</text>
  <text x="125" y="337" font-size="12" fill="#0F6E56">조건: requests == limits (전부 동일)</text>
  <text x="125" y="357" font-size="12" fill="#0F6E56">결과: 가장 마지막에 축출</text>
  <rect x="545" y="307" width="115" height="28" rx="6" fill="#0F6E56"/>
  <text x="602" y="326" text-anchor="middle" font-size="11" font-weight="500" fill="#FFFFFF">최대 보호</text>

  <!-- Side note -->
  <rect x="100" y="410" width="580" height="32" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="390" y="431" text-anchor="middle" font-size="11" fill="#5F5E5A">OOMKilled (limits 초과) != Eviction (노드 메모리 압박) — 다른 메커니즘</text>

  <!-- Key insight -->
  <text x="350" y="475" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">정직하게 선언할수록 보호받는 인센티브 구조</text>
</svg>