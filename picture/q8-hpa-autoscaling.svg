<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <rect width="600" height="300" fill="#ffffff"/>
  <rect x="50" y="120" width="100" height="50" fill="#f3e5f5" stroke="#9c27b0" rx="5"/>
  <text x="100" y="150" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">metrics-server</text>
  
  <rect x="250" y="120" width="100" height="50" fill="#fff3e0" stroke="#ff9800" rx="5"/>
  <text x="300" y="150" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">HPA</text>
  
  <rect x="450" y="80" width="100" height="130" fill="#e8f5e9" stroke="#4caf50" rx="5"/>
  <text x="500" y="105" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Deployment</text>
  
  <path d="M 150 145 L 240 145" stroke="#9c27b0" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 350 145 L 440 145" stroke="#ff9800" stroke-width="2" marker-end="url(#arrow)"/>
  
  <text x="200" y="135" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">CPU > 80%</text>
  <text x="400" y="135" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">증설</text>
  
  <rect x="470" y="120" width="60" height="20" fill="#c8e6c9" stroke="#4caf50"/><text x="500" y="135" font-family="sans-serif" font-size="10" text-anchor="middle">Pod 1</text>
  <rect x="470" y="150" width="60" height="20" fill="#c8e6c9" stroke="#4caf50"/><text x="500" y="165" font-family="sans-serif" font-size="10" text-anchor="middle">Pod 2</text>
  <rect x="470" y="180" width="60" height="20" fill="#c8e6c9" stroke="#4caf50"/><text x="500" y="195" font-family="sans-serif" font-size="10" text-anchor="middle">Pod 3</text>
  
  <text x="300" y="200" font-family="sans-serif" font-size="12" fill="#d32f2f" text-anchor="middle">MAX replicas 도달 시 멈춤</text>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
</svg>
