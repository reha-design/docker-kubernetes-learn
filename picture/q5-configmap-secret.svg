<svg width="680" height="310" viewBox="0 0 680 310" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>ConfigMap과 Secret을 이용한 설정 분리</title>
  <desc>동일한 애플리케이션 이미지를 유지하면서 개발 환경에는 ConfigMap을, 운영 환경에는 Secret을 주입하여 재빌드 없이 모든 환경에서 공용 사용합니다.</desc>
  <rect x="0" y="0" width="680" height="310" fill="#FFFFFF"/>

  <!-- Top: Common Image -->
  <rect x="220" y="25" width="240" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="340" y="52" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">동일한 이미지 (dev/prod 공용)</text>

  <!-- Flow Lines to Pods -->
  <line x1="280" y1="69" x2="175" y2="180" stroke="#5F5E5A" stroke-width="1.5"/>
  <line x1="400" y1="69" x2="505" y2="180" stroke="#5F5E5A" stroke-width="1.5"/>

  <!-- Left: Dev Environment -->
  <rect x="60" y="100" width="230" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="175" y="127" text-anchor="middle" font-size="12" font-weight="500" fill="#633806">ConfigMap (개발 DB 주소/설정)</text>

  <rect x="60" y="180" width="230" height="54" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="175" y="203" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">개발 Pod</text>
  <text x="175" y="222" text-anchor="middle" font-size="11" fill="#993C1D">ConfigMap 주입받아 실행</text>

  <!-- Right: Prod Environment -->
  <rect x="390" y="100" width="230" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="505" y="127" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">Secret (운영 비밀번호/인증서)</text>

  <rect x="390" y="180" width="230" height="54" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="505" y="203" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">운영 Pod</text>
  <text x="505" y="222" text-anchor="middle" font-size="11" fill="#993C1D">Secret 주입받아 실행</text>

  <!-- Bottom Summary -->
  <rect x="60" y="252" width="560" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="340" y="277" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">설정을 외부에 두어 이미지 재빌드 없이 전 환경에서 검증된 이미지 그대로 실행 가능</text>
</svg>
