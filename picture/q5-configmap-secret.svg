<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <rect width="600" height="300" fill="#ffffff"/>
  <rect x="250" y="20" width="100" height="50" fill="#eceff1" stroke="#607d8b"/>
  <text x="300" y="45" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="middle">동일한 이미지</text>

  <rect x="100" y="180" width="120" height="60" fill="#e3f2fd" stroke="#2196f3" rx="5"/>
  <text x="160" y="210" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="middle">개발 Pod</text>

  <rect x="380" y="180" width="120" height="60" fill="#e8f5e9" stroke="#4caf50" rx="5"/>
  <text x="440" y="210" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="middle">운영 Pod</text>

  <path d="M 280 70 L 160 180" stroke="#607d8b" stroke-width="2"/>
  <path d="M 320 70 L 440 180" stroke="#607d8b" stroke-width="2"/>

  <rect x="40" y="100" width="130" height="40" fill="#fff9c4" stroke="#fbc02d" rx="5"/>
  <text x="105" y="120" font-family="sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">ConfigMap (개발 DB)</text>
  <path d="M 105 140 L 140 180" stroke="#fbc02d" stroke-width="2" stroke-dasharray="4"/>

  <rect x="430" y="100" width="130" height="40" fill="#ffcdd2" stroke="#f44336" rx="5"/>
  <text x="495" y="120" font-family="sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">Secret (운영 비밀번호)</text>
  <path d="M 495 140 L 460 180" stroke="#f44336" stroke-width="2" stroke-dasharray="4"/>

  <text x="300" y="270" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">설정을 분리하면 동일한 이미지가 모든 환경에서 그대로 동작한다</text>
</svg>
