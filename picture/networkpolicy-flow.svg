<svg width="720" height="580" viewBox="0 0 720 580" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>NetworkPolicy — baseline부터 네임스페이스 간 허용까지</title>
  <desc>정책이 없을 때는 모든 트래픽이 허용되고, deny-all을 걸면 전부 차단되며, podSelector로 특정 라벨을 가진 Pod만 선택적으로 허용할 수 있다. namespaceSelector를 쓰면 다른 네임스페이스 전체를 출처로 허용할 수 있다. 같은 Pod를 대상으로 하는 여러 정책은 합집합으로 적용된다.</desc>
  <rect x="0" y="0" width="720" height="580" fill="#FFFFFF"/>
  <defs>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="360" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#2C2C2A">NetworkPolicy — baseline부터 네임스페이스 간 허용까지</text>

  <!-- Row 1: baseline (neutral) -->
  <rect x="30" y="50" width="660" height="90" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
  <text x="50" y="72" font-size="13" font-weight="600" fill="#2C2C2A">① 정책 없음 (baseline)</text>
  <rect x="60" y="88" width="110" height="36" rx="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
  <text x="115" y="110" text-anchor="middle" font-size="11" fill="#2C2C2A">test-client</text>
  <line x1="175" y1="106" x2="290" y2="106" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="232" y="98" text-anchor="middle" font-size="10" fill="#0F6E56">허용</text>
  <rect x="295" y="88" width="110" height="36" rx="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
  <text x="350" y="110" text-anchor="middle" font-size="11" fill="#2C2C2A">secure-app</text>
  <text x="430" y="110" font-size="11" fill="#5F5E5A">모든 Pod 간 트래픽이 기본적으로 전부 허용(flat network)</text>

  <!-- Row 2: deny-all (red) -->
  <rect x="30" y="152" width="660" height="90" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/>
  <text x="50" y="174" font-size="13" font-weight="600" fill="#712B13">② deny-all (podSelector: {})</text>
  <rect x="60" y="190" width="110" height="36" rx="6" fill="#FFFFFF" stroke="#993C1D" stroke-width="1"/>
  <text x="115" y="212" text-anchor="middle" font-size="11" fill="#712B13">test-client</text>
  <line x1="175" y1="208" x2="290" y2="208" stroke="#993C1D" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="232" y="200" text-anchor="middle" font-size="14" fill="#993C1D">✕</text>
  <rect x="295" y="190" width="110" height="36" rx="6" fill="#FFFFFF" stroke="#993C1D" stroke-width="1"/>
  <text x="350" y="212" text-anchor="middle" font-size="11" fill="#712B13">secure-app</text>
  <text x="430" y="212" font-size="11" fill="#712B13">네임스페이스의 모든 Pod에 적용, 규칙 없음 = 전부 차단</text>

  <!-- Row 3: selective allow (split) -->
  <rect x="30" y="254" width="660" height="110" rx="10" fill="#FEF9C3" stroke="#A16207" stroke-width="1.2"/>
  <text x="50" y="276" font-size="13" font-weight="600" fill="#713F12">③ 선택적 allow — podSelector (라벨 매칭)</text>

  <rect x="60" y="290" width="140" height="36" rx="6" fill="#FFFFFF" stroke="#993C1D" stroke-width="1"/>
  <text x="130" y="308" text-anchor="middle" font-size="10" fill="#712B13">test-client</text>
  <text x="130" y="320" text-anchor="middle" font-size="9" fill="#993C1D">(라벨 없음)</text>
  <line x1="205" y1="308" x2="290" y2="308" stroke="#993C1D" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="247" y="300" text-anchor="middle" font-size="13" fill="#993C1D">✕</text>

  <rect x="60" y="332" width="140" height="36" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="130" y="350" text-anchor="middle" font-size="10" fill="#085041">test-client-allowed</text>
  <text x="130" y="362" text-anchor="middle" font-size="9" fill="#0F6E56">(access: allowed)</text>
  <line x1="205" y1="350" x2="290" y2="322" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="247" y="332" text-anchor="middle" font-size="10" fill="#0F6E56">허용</text>

  <rect x="295" y="308" width="110" height="36" rx="6" fill="#FFFFFF" stroke="#A16207" stroke-width="1"/>
  <text x="350" y="330" text-anchor="middle" font-size="11" fill="#713F12">secure-app</text>
  <text x="430" y="330" font-size="11" fill="#713F12">라벨 있는 Pod에서만 접근 허용,</text>
  <text x="430" y="346" font-size="11" fill="#713F12">deny-all과 합쳐져(OR) 적용됨</text>

  <!-- Row 4: cross-namespace allow (purple) -->
  <rect x="30" y="376" width="660" height="120" rx="10" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.2"/>
  <text x="50" y="398" font-size="13" font-weight="600" fill="#4C1D95">④ namespaceSelector (네임스페이스 간 허용)</text>

  <rect x="60" y="414" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="140" y="432" text-anchor="middle" font-size="10" font-weight="500" fill="#4C1D95">ns: envoy-gateway-system</text>
  <rect x="75" y="440" width="130" height="26" rx="5" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1"/>
  <text x="140" y="457" text-anchor="middle" font-size="10" fill="#4C1D95">Envoy 프록시</text>

  <line x1="222" y1="450" x2="290" y2="450" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="256" y="442" text-anchor="middle" font-size="10" fill="#7C3AED">허용</text>

  <rect x="295" y="414" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="375" y="432" text-anchor="middle" font-size="10" font-weight="500" fill="#4C1D95">ns: default</text>
  <rect x="310" y="440" width="130" height="26" rx="5" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1"/>
  <text x="375" y="457" text-anchor="middle" font-size="10" fill="#4C1D95">backend Pod</text>

  <text x="480" y="440" font-size="11" fill="#4C1D95">kubernetes.io/metadata.name 라벨로</text>
  <text x="480" y="456" font-size="11" fill="#4C1D95">다른 네임스페이스 전체를 출처로 허용</text>

  <!-- Key point -->
  <rect x="60" y="508" width="600" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="360" y="530" text-anchor="middle" font-size="12" font-weight="600" fill="#2C2C2A">같은 Pod를 대상으로 하는 여러 NetworkPolicy는 합집합(OR)으로 적용된다</text>
  <text x="360" y="548" text-anchor="middle" font-size="11" fill="#5F5E5A">deny-all은 인프라 트래픽(Gateway 프록시 등)까지 막을 수 있으니 네임스페이스 허용을 잊지 말 것</text>
</svg>
