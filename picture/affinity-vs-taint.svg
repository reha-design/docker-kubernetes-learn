<svg width="700" height="460" viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>Affinity vs Taint — 스케줄링 방향이 반대</title>
  <desc>Kubernetes 스케줄링에서 Affinity는 파드가 노드를 끌어당기는 방향이고, Taint/Toleration은 노드가 파드를 밀어내는 방향이다. 방향이 정반대인 두 메커니즘을 비교한다.</desc>
  <rect x="0" y="0" width="700" height="460" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#2C2C2A">Affinity vs Taint — 스케줄링 방향이 반대</text>

  <!-- === Left half: Affinity (Green) === -->
  <rect x="15" y="48" width="325" height="340" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="177" y="74" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Affinity (끌어당김)</text>

  <!-- nodeAffinity section label -->
  <text x="35" y="100" font-size="12" font-weight="500" fill="#085041">nodeAffinity</text>

  <!-- Pod -->
  <rect x="40" y="112" width="90" height="40" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
  <text x="85" y="137" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">Pod</text>

  <!-- Arrow from Pod to Node -->
  <line x1="135" y1="132" x2="198" y2="132" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="167" y="124" text-anchor="middle" font-size="10" fill="#0F6E56">원한다</text>

  <!-- Node -->
  <rect x="205" y="112" width="115" height="40" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
  <text x="262" y="130" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">Node</text>
  <text x="262" y="146" text-anchor="middle" font-size="10" fill="#0F6E56">gpu=true</text>

  <text x="177" y="175" text-anchor="middle" font-size="11" fill="#0F6E56">"이 노드를 원한다"</text>

  <!-- Divider within Affinity section -->
  <line x1="35" y1="190" x2="320" y2="190" stroke="#0F6E56" stroke-width="0.5" stroke-dasharray="4,3"/>

  <!-- podAntiAffinity section label -->
  <text x="35" y="212" font-size="12" font-weight="500" fill="#085041">podAntiAffinity</text>

  <!-- Pod A -->
  <rect x="40" y="225" width="90" height="40" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
  <text x="85" y="250" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">Pod A</text>

  <!-- Repulsion arrows (pointing outward from center) -->
  <line x1="155" y1="245" x2="138" y2="245" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="177" y="250" text-anchor="middle" font-size="16" fill="#993C1D">&#x2715;</text>
  <line x1="200" y1="245" x2="217" y2="245" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- Pod B -->
  <rect x="224" y="225" width="90" height="40" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
  <text x="269" y="250" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">Pod B</text>

  <text x="177" y="290" text-anchor="middle" font-size="11" fill="#0F6E56">"같은 노드 피하기 = 분산 배치"</text>

  <!-- Direction summary for Affinity -->
  <rect x="45" y="310" width="265" height="30" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
  <text x="177" y="330" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">파드 -> 노드 (끌어당김)</text>

  <!-- Vertical divider -->
  <line x1="348" y1="48" x2="348" y2="388" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="6,4"/>

  <!-- === Right half: Taint/Toleration (Red/Orange) === -->
  <rect x="362" y="48" width="325" height="340" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/>
  <text x="524" y="74" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">Taint/Toleration (밀어냄)</text>

  <!-- Node with taint -->
  <rect x="440" y="92" width="168" height="48" rx="8" fill="#FFFFFF" stroke="#993C1D" stroke-width="1.5"/>
  <text x="524" y="113" text-anchor="middle" font-size="12" font-weight="600" fill="#712B13">Node</text>
  <text x="524" y="131" text-anchor="middle" font-size="10" fill="#993C1D">taint: gpu=true:NoSchedule</text>

  <!-- Barrier line from node -->
  <rect x="395" y="150" width="258" height="4" rx="2" fill="#993C1D"/>
  <text x="524" y="168" text-anchor="middle" font-size="10" font-weight="500" fill="#712B13">Taint 장벽</text>

  <!-- Rejected pod 1 -->
  <rect x="400" y="182" width="85" height="36" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="442" y="205" text-anchor="middle" font-size="11" fill="#5F5E5A">Pod 1</text>
  <text x="500" y="205" text-anchor="middle" font-size="14" fill="#993C1D">&#x2715; 거부</text>

  <!-- Rejected pod 2 -->
  <rect x="400" y="228" width="85" height="36" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="442" y="251" text-anchor="middle" font-size="11" fill="#5F5E5A">Pod 2</text>
  <text x="500" y="251" text-anchor="middle" font-size="14" fill="#993C1D">&#x2715; 거부</text>

  <!-- Allowed pod with toleration -->
  <rect x="400" y="278" width="85" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="442" y="301" text-anchor="middle" font-size="11" font-weight="500" fill="#085041">Pod 3</text>
  <text x="500" y="301" text-anchor="middle" font-size="14" fill="#0F6E56">&#x2713; 통과</text>
  <text x="566" y="301" font-size="10" fill="#0F6E56">toleration 보유</text>

  <text x="524" y="338" text-anchor="middle" font-size="11" fill="#993C1D">"노드가 기본 거부, 허가된 파드만 통과"</text>

  <!-- Direction summary for Taint -->
  <rect x="400" y="352" width="248" height="30" rx="6" fill="#FFFFFF" stroke="#993C1D" stroke-width="1"/>
  <text x="524" y="372" text-anchor="middle" font-size="12" font-weight="500" fill="#712B13">노드 -> 파드 (밀어냄)</text>

  <!-- Bottom comparison summary -->
  <rect x="60" y="410" width="580" height="36" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="200" y="433" text-anchor="middle" font-size="12" fill="#085041">Affinity: 파드가 노드를 선택</text>
  <text x="350" y="433" text-anchor="middle" font-size="12" fill="#5F5E5A">vs</text>
  <text x="490" y="433" text-anchor="middle" font-size="12" fill="#712B13">Taint: 노드가 파드를 거부</text>
</svg>