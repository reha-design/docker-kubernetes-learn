<svg width="700" height="350" viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>Pod, Deployment, Service 구조</title>
  <rect x="0" y="0" width="700" height="350" fill="#FFFFFF"/>
  
  <!-- Deployment Box -->
  <rect x="250" y="50" width="400" height="230" fill="#F8FAFC" stroke="#64748B" stroke-width="2" stroke-dasharray="5 5" rx="10"/>
  <text x="450" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">Deployment (개수 유지 / 롤링 업데이트)</text>
  
  <!-- Pods -->
  <rect x="280" y="110" width="100" height="120" fill="#E2E8F0" stroke="#475569" stroke-width="1.5" rx="5"/>
  <text x="330" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">Pod 1</text>
  <text x="330" y="165" text-anchor="middle" font-size="12" fill="#475569">IP: 10.1.1.11</text>
  <text x="330" y="190" text-anchor="middle" font-size="12" fill="#475569">(App 컨테이너)</text>
  
  <rect x="400" y="110" width="100" height="120" fill="#E2E8F0" stroke="#475569" stroke-width="1.5" rx="5"/>
  <text x="450" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">Pod 2</text>
  <text x="450" y="165" text-anchor="middle" font-size="12" fill="#475569">IP: 10.1.1.25</text>
  <text x="450" y="190" text-anchor="middle" font-size="12" fill="#475569">(App 컨테이너)</text>
  
  <rect x="520" y="110" width="100" height="120" fill="#E2E8F0" stroke="#475569" stroke-width="1.5" rx="5"/>
  <text x="570" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">Pod 3</text>
  <text x="570" y="165" text-anchor="middle" font-size="12" fill="#475569">IP: 10.1.1.12</text>
  <text x="570" y="190" text-anchor="middle" font-size="12" fill="#475569">(App 컨테이너)</text>

  <!-- Service Box -->
  <rect x="50" y="110" width="120" height="120" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" rx="5"/>
  <text x="110" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#1D4ED8">Service</text>
  <text x="110" y="175" text-anchor="middle" font-size="12" fill="#1E40AF">고정 IP:</text>
  <text x="110" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E40AF">10.96.0.100</text>

  <!-- Arrows -->
  <path d="M170 170 L270 140" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M170 170 L390 170" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M170 170 L510 200" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563EB" />
    </marker>
  </defs>

  <!-- Description Text -->
  <text x="350" y="315" text-anchor="middle" font-size="14" fill="#334155">클라이언트가 Service 고정 IP로 접속하면, 트래픽을 살아있는 Pod들에게 분산(로드밸런싱)합니다.</text>
</svg>
