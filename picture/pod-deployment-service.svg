<svg width="680" height="392" viewBox="0 0 680 392" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>Pod, Deployment, Service 관계 구조도</title>
  <desc>클라이언트 요청이 Service를 거쳐 Deployment가 관리하는 3개의 Pod로 전달되는 구조를 보여준다.</desc>

  <rect x="0" y="0" width="680" height="392" fill="#FFFFFF"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 클라이언트 요청 -->
  <rect x="260" y="20" width="160" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="340" y="47" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">클라이언트 요청</text>

  <line x1="340" y1="64" x2="340" y2="98" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Service -->
  <rect x="230" y="100" width="220" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="340" y="123" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Service</text>
  <text x="340" y="143" text-anchor="middle" font-size="12" fill="#0F6E56">IP 고정 + 부하 분산</text>

  <line x1="340" y1="156" x2="340" y2="194" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="352" y="182" font-size="12" fill="#5F5E5A">라벨 셀렉터로 연결</text>

  <!-- Deployment 컨테이너 -->
  <rect x="40" y="196" width="600" height="156" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="60" y="226" font-size="14" font-weight="500" fill="#444441">Deployment</text>
  <text x="60" y="246" font-size="12" fill="#5F5E5A">복제본 3개를 항상 유지</text>

  <!-- Pod 1 -->
  <rect x="80" y="260" width="160" height="62" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="160" y="285" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Pod</text>
  <text x="160" y="305" text-anchor="middle" font-size="12" fill="#993C1D">IP가 계속 바뀜</text>

  <!-- Pod 2 -->
  <rect x="260" y="260" width="160" height="62" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="340" y="285" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Pod</text>
  <text x="340" y="305" text-anchor="middle" font-size="12" fill="#993C1D">IP가 계속 바뀜</text>

  <!-- Pod 3 -->
  <rect x="440" y="260" width="160" height="62" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="520" y="285" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Pod</text>
  <text x="520" y="305" text-anchor="middle" font-size="12" fill="#993C1D">IP가 계속 바뀜</text>
</svg>
