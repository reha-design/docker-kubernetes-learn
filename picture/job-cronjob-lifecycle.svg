<svg width="700" height="540" viewBox="0 0 700 540" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>Job / CronJob — 완료 목적 워크로드의 생명주기</title>
  <desc>CronJob이 스케줄마다 Job을 생성하고, 각 Job이 Pod를 생성한다. historyLimit으로 오래된 Job은 자동 삭제되며, completions와 parallelism으로 Pod 실행 방식을 제어한다.</desc>

  <rect x="0" y="0" width="700" height="540" fill="#FFFFFF"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1A73E8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- CronJob box -->
  <rect x="220" y="20" width="260" height="65" rx="10" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.2"/>
  <text x="350" y="45" text-anchor="middle" font-size="14" font-weight="600" fill="#4C1D95">CronJob</text>
  <text x="350" y="65" text-anchor="middle" font-size="12" fill="#7C3AED">schedule: "*/1 * * * *"</text>
  <text x="350" y="79" text-anchor="middle" font-size="11" fill="#4C1D95">successfulJobsHistoryLimit: 3</text>

  <!-- Arrow: CronJob -> Jobs -->
  <line x1="350" y1="85" x2="350" y2="125" stroke="#7C3AED" stroke-width="1.2" marker-end="url(#arrow-purple)"/>
  <text x="365" y="110" font-size="11" fill="#7C3AED">스케줄마다 새로 생성</text>

  <!-- Job boxes row -->
  <!-- Job-001 (faded/deleted) -->
  <g opacity="0.35">
    <rect x="40" y="130" width="160" height="55" rx="8" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1"/>
    <text x="120" y="153" text-anchor="middle" font-size="13" font-weight="500" fill="#0D47A1">Job-001</text>
    <text x="120" y="172" text-anchor="middle" font-size="11" fill="#1A73E8">10:01 (완료)</text>
  </g>
  <line x1="40" y1="130" x2="200" y2="185" stroke="#993C1D" stroke-width="1.5" opacity="0.7"/>
  <line x1="200" y1="130" x2="40" y2="185" stroke="#993C1D" stroke-width="1.5" opacity="0.7"/>
  <text x="120" y="205" text-anchor="middle" font-size="10" fill="#993C1D">historyLimit으로</text>
  <text x="120" y="217" text-anchor="middle" font-size="10" fill="#993C1D">자동 삭제</text>

  <!-- Job-002 (active) -->
  <rect x="260" y="130" width="160" height="55" rx="8" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.2"/>
  <text x="340" y="153" text-anchor="middle" font-size="13" font-weight="600" fill="#0D47A1">Job-002</text>
  <text x="340" y="172" text-anchor="middle" font-size="11" fill="#1A73E8">10:02 (실행 중)</text>

  <!-- Job-003 (pending) -->
  <rect x="480" y="130" width="160" height="55" rx="8" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.2"/>
  <text x="560" y="153" text-anchor="middle" font-size="13" font-weight="600" fill="#0D47A1">Job-003</text>
  <text x="560" y="172" text-anchor="middle" font-size="11" fill="#1A73E8">10:03 (대기)</text>

  <!-- Time arrow -->
  <line x1="60" y1="232" x2="640" y2="232" stroke="#B4B2A9" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="650" y="237" font-size="10" fill="#5F5E5A">시간</text>

  <!-- Arrow: Job-002 -> Pods -->
  <line x1="340" y1="185" x2="340" y2="255" stroke="#1A73E8" stroke-width="1.2" marker-end="url(#arrow-blue)"/>

  <!-- Pod section for Job-002: completions:3, parallelism:2 -->
  <rect x="100" y="260" width="500" height="170" rx="10" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="115" y="280" font-size="12" font-weight="500" fill="#5F5E5A">Job-002의 Pod들 (completions: 3, parallelism: 2)</text>

  <!-- Wave 1: 2 pods in parallel -->
  <text x="130" y="310" font-size="11" fill="#5F5E5A">1차 병렬:</text>
  <rect x="210" y="294" width="120" height="34" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="270" y="316" text-anchor="middle" font-size="12" fill="#085041">Pod-A (완료)</text>
  <rect x="350" y="294" width="120" height="34" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="410" y="316" text-anchor="middle" font-size="12" fill="#085041">Pod-B (완료)</text>

  <!-- Arrow between waves -->
  <line x1="350" y1="332" x2="350" y2="350" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Wave 2: 1 more pod -->
  <text x="130" y="372" font-size="11" fill="#5F5E5A">2차:</text>
  <rect x="210" y="355" width="120" height="34" rx="8" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1"/>
  <text x="270" y="377" text-anchor="middle" font-size="12" fill="#0D47A1">Pod-C (실행 중)</text>

  <!-- Parallelism annotation -->
  <text x="500" y="310" font-size="11" fill="#0F6E56">parallelism: 2</text>
  <text x="500" y="326" font-size="11" fill="#0F6E56">→ 동시에 최대 2개</text>
  <text x="500" y="375" font-size="11" fill="#1A73E8">completions: 3</text>
  <text x="500" y="391" font-size="11" fill="#1A73E8">→ 총 3개 성공 필요</text>

  <!-- Key points box -->
  <rect x="60" y="450" width="580" height="72" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="350" y="474" text-anchor="middle" font-size="13" font-weight="600" fill="#2C2C2A">Deployment: 계속 실행 (서버) ↔ Job: 완료가 목적 (배치)</text>
  <text x="350" y="494" text-anchor="middle" font-size="11" fill="#5F5E5A">completions: 성공 목표 수 | parallelism: 동시 실행 수 | backoffLimit: 재시도 횟수</text>
  <text x="350" y="510" text-anchor="middle" font-size="11" fill="#5F5E5A">CronJob → 스케줄마다 Job 생성 → Job이 Pod 생성 → 완료 후 Pod는 Completed 상태로 유지</text>
</svg>