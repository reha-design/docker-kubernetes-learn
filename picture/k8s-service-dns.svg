<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="400" fill="#ffffff"/>
  
  <!-- Pod A -->
  <rect x="40" y="160" width="120" height="80" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="100" y="200" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1565c0">Pod A</text>
  <text x="100" y="220" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#555">클라이언트</text>
  
  <!-- CoreDNS -->
  <rect x="220" y="40" width="140" height="80" rx="10" fill="#fff3e0" stroke="#fb8c00" stroke-width="2"/>
  <text x="290" y="80" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#e65100">CoreDNS</text>
  <text x="290" y="100" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#555">my-service → IP</text>
  
  <!-- Service / kube-proxy Section -->
  <rect x="250" y="180" width="220" height="150" rx="10" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="2" stroke-dasharray="5"/>
  <text x="360" y="205" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#757575">쿠버네티스 네트워크</text>

  <!-- Service (ClusterIP) -->
  <rect x="280" y="220" width="160" height="40" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  <text x="360" y="245" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2e7d32">Service (ClusterIP)</text>

  <!-- kube-proxy -->
  <rect x="280" y="275" width="160" height="40" rx="8" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2"/>
  <text x="360" y="300" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#6a1b9a">kube-proxy</text>

  <!-- Pod B Group -->
  <!-- Pod B-1 (Ready) -->
  <rect x="600" y="130" width="120" height="60" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="660" y="160" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1565c0">Pod B-1</text>
  <text x="660" y="175" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#2e7d32">(Ready)</text>

  <!-- Pod B-2 (Ready) -->
  <rect x="600" y="210" width="120" height="60" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="660" y="240" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1565c0">Pod B-2</text>
  <text x="660" y="255" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#2e7d32">(Ready)</text>

  <!-- Pod B-3 (Not Ready) -->
  <rect x="600" y="290" width="120" height="60" rx="10" fill="#fafafa" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="4"/>
  <text x="660" y="320" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#757575">Pod B-3</text>
  <text x="660" y="335" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#d32f2f">(Not Ready)</text>

  <!-- Flow Lines & Arrows -->
  
  <!-- 1. DNS Query -->
  <path d="M 120 160 Q 120 80 210 80" fill="none" stroke="#fb8c00" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="140" y="115" font-family="sans-serif" font-size="12" fill="#e65100">1. DNS 쿼리 ("my-service")</text>

  <!-- 2. DNS Response -->
  <path d="M 210 60 Q 90 60 90 150" fill="none" stroke="#fb8c00" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-orange)"/>
  <text x="80" y="55" font-family="sans-serif" font-size="12" fill="#e65100">2. ClusterIP 반환</text>

  <!-- 3. Traffic to Service -->
  <path d="M 160 200 L 270 240" fill="none" stroke="#43a047" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="150" y="245" font-family="sans-serif" font-size="12" fill="#2e7d32">3. IP 접속 시도</text>

  <!-- Internal Service to kube-proxy -->
  <path d="M 360 260 L 360 265" fill="none" stroke="#8e24aa" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- 4. kube-proxy load balancing -->
  <path d="M 440 295 Q 520 295 520 160 L 590 160" fill="none" stroke="#1e88e5" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 440 295 Q 520 295 520 240 L 590 240" fill="none" stroke="#1e88e5" stroke-width="2" marker-end="url(#arrow-blue)"/>
  
  <text x="490" y="195" font-family="sans-serif" font-size="12" fill="#1565c0">4. Ready 파드로만 분배</text>
  <text x="490" y="210" font-family="sans-serif" font-size="12" fill="#1565c0">(로드밸런싱)</text>

  <!-- Markers Definitions -->
  <defs>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb8c00"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#43a047"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8e24aa"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e88e5"/>
    </marker>
  </defs>
</svg>
