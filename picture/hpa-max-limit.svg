<svg width="680" height="164" viewBox="0 0 680 164" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>HPA가 max replicas에 도달한 이후 벌어지는 일</title>
  <desc>부하가 늘면 HPA가 replica를 늘리지만 max에 도달하면 더 늘리지 않고, 초과 부하는 기존 파드가 나눠 받으며 응답이 지연되거나 실패한다.</desc>
  <rect x="0" y="0" width="680" height="164" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="40" y="60" width="130" height="64" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="105" y="86" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">부하 증가</text>
  <text x="105" y="107" text-anchor="middle" font-size="12" fill="#5F5E5A">CPU 사용률 상승</text>
  <line x1="170" y1="92" x2="190" y2="92" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="190" y="60" width="130" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="255" y="86" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">HPA 동작</text>
  <text x="255" y="107" text-anchor="middle" font-size="12" fill="#0F6E56">replica 증가</text>
  <line x1="320" y1="92" x2="340" y2="92" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="340" y="60" width="130" height="64" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="405" y="86" text-anchor="middle" font-size="14" font-weight="500" fill="#633806">Max 도달</text>
  <text x="405" y="107" text-anchor="middle" font-size="12" fill="#854F0B">replicas 상한</text>
  <line x1="470" y1="92" x2="490" y2="92" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="490" y="60" width="130" height="64" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="555" y="86" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">증설 없음</text>
  <text x="555" y="107" text-anchor="middle" font-size="12" fill="#993C1D">응답 지연/실패</text>
</svg>
