<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <rect width="600" height="300" fill="#ffffff"/>
  <text x="150" y="30" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">가상머신 (VM)</text>
  <text x="450" y="30" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">컨테이너</text>

  <!-- VM Stack -->
  <rect x="50" y="240" width="200" height="30" fill="#e0e0e0" stroke="#9e9e9e"/><text x="150" y="255" font-family="sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">하드웨어</text>
  <rect x="50" y="200" width="200" height="30" fill="#ffecb3" stroke="#ffb300"/><text x="150" y="215" font-family="sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">하이퍼바이저</text>
  <rect x="50" y="130" width="90" height="60" fill="#f8bbd0" stroke="#d81b60"/><text x="95" y="160" font-family="sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">게스트 OS</text>
  <rect x="160" y="130" width="90" height="60" fill="#f8bbd0" stroke="#d81b60"/><text x="205" y="160" font-family="sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">게스트 OS</text>
  <rect x="50" y="80" width="90" height="40" fill="#bbdefb" stroke="#1e88e5"/><text x="95" y="100" font-family="sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">앱 A</text>
  <rect x="160" y="80" width="90" height="40" fill="#c8e6c9" stroke="#43a047"/><text x="205" y="100" font-family="sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">앱 B</text>

  <!-- Container Stack -->
  <rect x="350" y="240" width="200" height="30" fill="#e0e0e0" stroke="#9e9e9e"/><text x="450" y="255" font-family="sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">하드웨어</text>
  <rect x="350" y="200" width="200" height="30" fill="#f8bbd0" stroke="#d81b60"/><text x="450" y="215" font-family="sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">호스트 OS (커널 공유)</text>
  <rect x="350" y="160" width="200" height="30" fill="#b3e5fc" stroke="#039be5"/><text x="450" y="175" font-family="sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">컨테이너 엔진</text>
  <rect x="350" y="80" width="90" height="70" fill="#bbdefb" stroke="#1e88e5"/><text x="395" y="115" font-family="sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">앱 A</text>
  <rect x="460" y="80" width="90" height="70" fill="#c8e6c9" stroke="#43a047"/><text x="505" y="115" font-family="sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">앱 B</text>
</svg>
