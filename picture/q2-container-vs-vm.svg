<svg width="680" height="330" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>가상머신(VM)과 컨테이너 구조 비교</title>
  <desc>가상머신은 하이퍼바이저 위에서 게스트 OS를 각각 실행하지만, 컨테이너는 호스트 OS의 커널을 공유하여 가볍게 실행됩니다.</desc>
  <rect x="0" y="0" width="680" height="330" fill="#FFFFFF"/>

  <!-- Left: VM Stack -->
  <rect x="40" y="30" width="285" height="270" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="182" y="58" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">가상머신 (VM)</text>

  <rect x="60" y="245" width="245" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="182" y="268" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">하드웨어</text>

  <rect x="60" y="200" width="245" height="36" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="182" y="223" text-anchor="middle" font-size="12" font-weight="500" fill="#633806">하이퍼바이저</text>

  <rect x="60" y="140" width="115" height="50" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="117" y="170" text-anchor="middle" font-size="12" font-weight="500" fill="#712B13">게스트 OS</text>

  <rect x="190" y="140" width="115" height="50" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="247" y="170" text-anchor="middle" font-size="12" font-weight="500" fill="#712B13">게스트 OS</text>

  <rect x="60" y="85" width="115" height="45" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="117" y="112" text-anchor="middle" font-size="12" font-weight="500" fill="#712B13">앱 A</text>

  <rect x="190" y="85" width="115" height="45" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="247" y="112" text-anchor="middle" font-size="12" font-weight="500" fill="#712B13">앱 B</text>

  <!-- Right: Container Stack -->
  <rect x="355" y="30" width="285" height="270" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="497" y="58" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">컨테이너 (Container)</text>

  <rect x="375" y="245" width="245" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="497" y="268" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">하드웨어</text>

  <rect x="375" y="200" width="245" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="497" y="223" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">호스트 OS (커널 공유)</text>

  <rect x="375" y="155" width="245" height="36" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="497" y="178" text-anchor="middle" font-size="12" font-weight="500" fill="#633806">컨테이너 엔진</text>

  <rect x="375" y="85" width="115" height="60" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="432" y="120" text-anchor="middle" font-size="12" font-weight="500" fill="#712B13">앱 A</text>

  <rect x="505" y="85" width="115" height="60" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="562" y="120" text-anchor="middle" font-size="12" font-weight="500" fill="#712B13">앱 B</text>
</svg>
