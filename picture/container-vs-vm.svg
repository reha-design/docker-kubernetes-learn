<svg width="700" height="520" viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>컨테이너 vs 가상머신(VM) — 구조 비교</title>
  <desc>왼쪽은 VM 구조(하드웨어→호스트OS→하이퍼바이저→게스트OS+앱), 오른쪽은 컨테이너 구조(하드웨어→호스트OS→컨테이너 엔진→앱). VM은 각각 별도 커널을 가져 무겁고, 컨테이너는 커널을 공유해 가볍다.</desc>
  <rect x="0" y="0" width="700" height="520" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#2C2C2A">컨테이너 vs 가상머신(VM) — 구조 비교</text>

  <!-- Dotted vertical divider -->
  <line x1="350" y1="50" x2="350" y2="460" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- === LEFT: VM === -->
  <text x="175" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#712B13">가상머신 (VM)</text>

  <!-- Hardware -->
  <rect x="40" y="380" width="270" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="175" y="405" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">하드웨어</text>

  <!-- Host OS -->
  <rect x="40" y="320" width="270" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="175" y="345" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">호스트 OS</text>

  <!-- Hypervisor -->
  <rect x="40" y="260" width="270" height="40" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="175" y="285" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">하이퍼바이저</text>

  <!-- VM 1 -->
  <rect x="50" y="100" width="115" height="140" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="107" y="120" text-anchor="middle" font-size="11" font-weight="500" fill="#712B13">VM 1</text>
  <rect x="60" y="130" width="95" height="36" rx="6" fill="#FFFFFF" stroke="#993C1D" stroke-width="0.8"/>
  <text x="107" y="153" text-anchor="middle" font-size="11" fill="#712B13">App</text>
  <rect x="60" y="176" width="95" height="50" rx="6" fill="#FFFFFF" stroke="#993C1D" stroke-width="0.8"/>
  <text x="107" y="196" text-anchor="middle" font-size="11" fill="#712B13">게스트 OS</text>
  <text x="107" y="210" text-anchor="middle" font-size="9" fill="#993C1D">(별도 커널)</text>

  <!-- VM 2 -->
  <rect x="185" y="100" width="115" height="140" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="242" y="120" text-anchor="middle" font-size="11" font-weight="500" fill="#712B13">VM 2</text>
  <rect x="195" y="130" width="95" height="36" rx="6" fill="#FFFFFF" stroke="#993C1D" stroke-width="0.8"/>
  <text x="242" y="153" text-anchor="middle" font-size="11" fill="#712B13">App</text>
  <rect x="195" y="176" width="95" height="50" rx="6" fill="#FFFFFF" stroke="#993C1D" stroke-width="0.8"/>
  <text x="242" y="196" text-anchor="middle" font-size="11" fill="#712B13">게스트 OS</text>
  <text x="242" y="210" text-anchor="middle" font-size="9" fill="#993C1D">(별도 커널)</text>

  <!-- === RIGHT: Container === -->
  <text x="525" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">컨테이너 (Docker)</text>

  <!-- Hardware -->
  <rect x="390" y="380" width="270" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="525" y="405" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">하드웨어</text>

  <!-- Host OS with kernel sharing -->
  <rect x="390" y="290" width="270" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="525" y="315" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">호스트 OS (커널 공유)</text>
  <text x="525" y="335" text-anchor="middle" font-size="11" fill="#0F6E56">namespace + cgroup</text>

  <!-- Container Engine -->
  <rect x="390" y="230" width="270" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="525" y="255" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">컨테이너 엔진</text>

  <!-- Container 1 -->
  <rect x="395" y="140" width="80" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <rect x="403" y="158" width="64" height="30" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="435" y="178" text-anchor="middle" font-size="11" fill="#085041">App</text>
  <text x="435" y="152" text-anchor="middle" font-size="9" fill="#0F6E56">컨테이너1</text>

  <!-- Container 2 -->
  <rect x="485" y="140" width="80" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <rect x="493" y="158" width="64" height="30" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="525" y="178" text-anchor="middle" font-size="11" fill="#085041">App</text>
  <text x="525" y="152" text-anchor="middle" font-size="9" fill="#0F6E56">컨테이너2</text>

  <!-- Container 3 -->
  <rect x="575" y="140" width="80" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <rect x="583" y="158" width="64" height="30" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="615" y="178" text-anchor="middle" font-size="11" fill="#085041">App</text>
  <text x="615" y="152" text-anchor="middle" font-size="9" fill="#0F6E56">컨테이너3</text>

  <!-- Bottom annotations -->
  <rect x="30" y="440" width="280" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="170" y="458" text-anchor="middle" font-size="11" font-weight="500" fill="#712B13">VM마다 별도 커널</text>
  <text x="170" y="474" text-anchor="middle" font-size="11" fill="#993C1D">무겁고 느림 (부팅 수십 초~분)</text>

  <rect x="390" y="440" width="280" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="530" y="458" text-anchor="middle" font-size="11" font-weight="500" fill="#085041">커널 공유</text>
  <text x="530" y="474" text-anchor="middle" font-size="11" fill="#0F6E56">가볍고 빠름 (1초 내외, 격리 수준은 낮음)</text>

  <!-- Brace-like lines connecting VMs to Hypervisor -->
  <line x1="107" y1="240" x2="107" y2="260" stroke="#993C1D" stroke-width="1"/>
  <line x1="242" y1="240" x2="242" y2="260" stroke="#993C1D" stroke-width="1"/>

  <!-- Lines connecting containers to engine -->
  <line x1="435" y1="210" x2="435" y2="230" stroke="#0F6E56" stroke-width="1"/>
  <line x1="525" y1="210" x2="525" y2="230" stroke="#0F6E56" stroke-width="1"/>
  <line x1="615" y1="210" x2="615" y2="230" stroke="#0F6E56" stroke-width="1"/>
</svg>