<svg width="680" height="310" viewBox="0 0 680 310" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>Requests vs Limits 및 Pending 대 OOMKilled 구조</title>
  <desc>Requests는 최소 보장 예약량으로 스케줄링 시 부족하면 Pending 상태가 되고, Limits는 사용 상한선으로 실행 중 넘으면 OOMKilled가 발생합니다.</desc>
  <rect x="0" y="0" width="680" height="310" fill="#FFFFFF"/>

  <!-- Left: Requests & Pending -->
  <rect x="40" y="30" width="285" height="255" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="182" y="58" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">Requests (최소 보장 예약량)</text>

  <rect x="60" y="80" width="245" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="182" y="107" text-anchor="middle" font-size="12" font-weight="500" fill="#633806">노드 자원 장부 (Requests 여유 없음)</text>

  <rect x="60" y="140" width="245" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="182" y="167" text-anchor="middle" font-size="12" font-weight="500" fill="#712B13">신규 Pod (요청 자원 수용 불가)</text>

  <rect x="60" y="200" width="245" height="48" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="182" y="222" text-anchor="middle" font-size="12" font-weight="500" fill="#712B13">Pending (입장 전 거절)</text>
  <text x="182" y="238" text-anchor="middle" font-size="11" fill="#993C1D">스케줄러가 노드 배치를 할 수 없음</text>

  <!-- Right: Limits & OOMKilled -->
  <rect x="355" y="30" width="285" height="255" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="497" y="58" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">Limits (사용량 최대 상한선)</text>

  <rect x="375" y="80" width="245" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="497" y="107" text-anchor="middle" font-size="12" font-weight="500" fill="#712B13">Pod 실행 중 (메모리 사용 급증)</text>

  <rect x="375" y="140" width="245" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="497" y="167" text-anchor="middle" font-size="12" font-weight="500" fill="#633806">Limits 메모리 상한선 초과!</text>

  <rect x="375" y="200" width="245" height="48" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="497" y="222" text-anchor="middle" font-size="12" font-weight="500" fill="#712B13">OOMKilled (입장 후 단속)</text>
  <text x="497" y="238" text-anchor="middle" font-size="11" fill="#993C1D">커널/Kubelet이 컨테이너 강제 종료</text>
</svg>
