  <rect x="80" y="150" width="70" height="30" fill="#ffebee" stroke="#f44336"/><text x="115" y="170" font-family="sans-serif" font-size="12" text-anchor="middle">신규 Pod</text>
  <text x="175" y="170" font-family="sans-serif" font-size="20" fill="#f44336">X</text>
  <text x="160" y="230" font-family="sans-serif" font-size="12" fill="#d32f2f" text-anchor="middle">입장 전에 거절됨 (Pending)</text>

