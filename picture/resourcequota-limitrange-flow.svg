<svg width="680" height="365" viewBox="0 0 680 365" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>ResourceQuota와 LimitRange의 상호작용</title>
  <desc>리소스를 명시하지 않은 파드는 ResourceQuota만 있을 때 거부되지만, LimitRange가 기본값을 자동 주입하면 그 요구 조건을 충족시켜 통과한다.</desc>

  <rect x="0" y="0" width="680" height="365" fill="#FFFFFF"/>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <line x1="338" y1="30" x2="338" y2="310" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="4 3"/>

  <text x="167" y="44" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">① LimitRange 적용 전</text>
  <text x="507" y="44" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">② LimitRange 적용 후</text>

  <!-- 왼쪽: LimitRange 없음 -->
  <rect x="45" y="60" width="245" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="167" y="84" text-anchor="middle" font-size="13" fill="#2C2C2A">day9-quota만 존재</text>

  <line x1="167" y1="100" x2="167" y2="128" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="45" y="130" width="245" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="167" y="154" text-anchor="middle" font-size="13" fill="#2C2C2A">리소스 미지정 파드 생성 시도</text>

  <line x1="167" y1="170" x2="167" y2="198" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="45" y="200" width="245" height="110" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
  <text x="167" y="225" text-anchor="middle" font-size="14" font-weight="500" fill="#791F1F">거부 (Forbidden)</text>
  <text x="167" y="248" text-anchor="middle" font-size="11" fill="#A32D2D">must specify</text>
  <text x="167" y="266" text-anchor="middle" font-size="11" fill="#A32D2D">limits.cpu, limits.memory,</text>
  <text x="167" y="284" text-anchor="middle" font-size="11" fill="#A32D2D">requests.cpu, requests.memory</text>

  <!-- 오른쪽: LimitRange 있음 -->
  <rect x="385" y="60" width="245" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="507" y="84" text-anchor="middle" font-size="13" fill="#2C2C2A">day9-quota + LimitRange 존재</text>

  <line x1="507" y1="100" x2="507" y2="128" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="385" y="130" width="245" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="507" y="154" text-anchor="middle" font-size="13" fill="#2C2C2A">동일한 파드 재시도</text>

  <line x1="507" y1="170" x2="507" y2="198" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="385" y="200" width="245" height="110" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="507" y="225" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">생성됨 (Running)</text>
  <text x="507" y="248" text-anchor="middle" font-size="11" fill="#0F6E56">requests: cpu=100m,</text>
  <text x="507" y="266" text-anchor="middle" font-size="11" fill="#0F6E56">memory=64Mi (자동 주입)</text>
  <text x="507" y="284" text-anchor="middle" font-size="11" fill="#0F6E56">limits: cpu=200m, memory=128Mi</text>

  <text x="338" y="333" text-anchor="middle" font-size="12" fill="#5F5E5A">
    <tspan x="338" dy="0">→ LimitRange가 ResourceQuota의 "반드시 명시" 요구 조건을</tspan>
    <tspan x="338" dy="18">기본값 자동 주입으로 대신 충족시켜준다</tspan>
  </text>
</svg>
