<svg width="680" height="330" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>StatefulSet의 핵심 보장 2가지 (고정 식별자 및 전용 스토리지)</title>
  <desc>StatefulSet은 파드마다 고정된 이름(mysql-0, mysql-1)과 순서를 보장하며, volumeClaimTemplates를 통해 파드 재시작 후에도 본인의 전용 PVC와 1:1로 재연결된다.</desc>
  <rect x="0" y="0" width="680" height="330" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Container Box -->
  <rect x="40" y="25" width="600" height="195" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="60" y="50" font-size="13" font-weight="500" fill="#444441">StatefulSet 파드 및 전용 PVC 매핑</text>

  <!-- Pod 0 (mysql-0) -->
  <rect x="75" y="68" width="210" height="54" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="180" y="90" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">mysql-0 (Primary)</text>
  <text x="180" y="110" text-anchor="middle" font-size="11" fill="#993C1D">보장 ① 고정 이름 &amp; 순서 0</text>

  <!-- Pod 1 (mysql-1) -->
  <rect x="395" y="68" width="210" height="54" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="500" y="90" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">mysql-1 (Replica)</text>
  <text x="500" y="110" text-anchor="middle" font-size="11" fill="#993C1D">보장 ① 고정 이름 &amp; 순서 1</text>

  <!-- Replication Line -->
  <line x1="285" y1="95" x2="395" y2="95" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <text x="340" y="87" text-anchor="middle" font-size="11" fill="#5F5E5A">데이터 복제</text>

  <!-- Vertical Connectors -->
  <line x1="180" y1="122" x2="180" y2="148" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <line x1="500" y1="122" x2="500" y2="148" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow-teal)"/>

  <!-- PVC 0 -->
  <rect x="95" y="148" width="170" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="180" y="168" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">data-mysql-0</text>
  <text x="180" y="186" text-anchor="middle" font-size="10" fill="#0F6E56">보장 ② 전용 스토리지</text>

  <!-- PVC 1 -->
  <rect x="415" y="148" width="170" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="500" y="168" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">data-mysql-1</text>
  <text x="500" y="186" text-anchor="middle" font-size="10" fill="#0F6E56">보장 ② 전용 스토리지</text>

  <!-- Conclusion Banner -->
  <rect x="40" y="235" width="600" height="68" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="340" y="260" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">StatefulSet 2대 보장: 파드 재시작 시에도 [고정 이름] + [전용 PVC] 유지</text>
  <text x="340" y="283" text-anchor="middle" font-size="11" fill="#0F6E56">mysql-0 파드가 장애로 다시 떠도 기존 data-mysql-0 PVC와 무조건 1:1 재연결</text>
</svg>
