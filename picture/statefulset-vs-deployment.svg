<svg width="680" height="370" viewBox="0 0 680 370" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>Deployment와 StatefulSet의 스토리지 구조 차이</title>
  <desc>Deployment는 모든 파드가 하나의 공유 PVC를 지정하지만, StatefulSet은 volumeClaimTemplates를 통해 파드마다 1:1 전용 PVC를 동적 생성하여 독립된 상태를 유지한다.</desc>
  <rect x="0" y="0" width="680" height="370" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Left Container: Deployment -->
  <rect x="30" y="30" width="300" height="320" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="50" y="58" font-size="14" font-weight="500" fill="#444441">Deployment (단일 Volume/PVC)</text>
  <text x="50" y="78" font-size="12" fill="#5F5E5A">N개 파드가 1개 동일 볼륨을 공유 시도</text>

  <!-- Deployment Pods -->
  <rect x="45" y="110" width="80" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="85" y="137" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">web-7f9d</text>

  <rect x="140" y="110" width="80" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="180" y="137" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">web-a3c1</text>

  <rect x="235" y="110" width="80" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="275" y="137" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">web-x9y8</text>

  <!-- Shared Arrow Lines -->
  <line x1="85" y1="154" x2="145" y2="210" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="154" x2="180" y2="210" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="275" y1="154" x2="215" y2="210" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Shared PVC -->
  <rect x="85" y="210" width="190" height="54" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="180" y="232" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">shared-pvc</text>
  <text x="180" y="250" text-anchor="middle" font-size="11" fill="#0F6E56">(단일 공유 PVC)</text>

  <!-- Left Bottom Note -->
  <rect x="45" y="282" width="270" height="50" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="180" y="302" text-anchor="middle" font-size="11" font-weight="500" fill="#633806">동일 볼륨을 다수 파드가 공동 바라봄</text>
  <text x="180" y="320" text-anchor="middle" font-size="11" fill="#854F0B">개별 DB 파드 데이터 독립 저장 불가</text>

  <!-- Right Container: StatefulSet -->
  <rect x="350" y="30" width="300" height="320" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="370" y="58" font-size="14" font-weight="500" fill="#444441">StatefulSet (volumeClaimTemplates)</text>
  <text x="370" y="78" font-size="12" fill="#5F5E5A">파드마다 1:1 전용 PVC 동적 생성</text>

  <!-- StatefulSet Pods -->
  <rect x="365" y="110" width="78" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="404" y="137" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">db-0</text>

  <rect x="461" y="110" width="78" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="500" y="137" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">db-1</text>

  <rect x="557" y="110" width="78" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="596" y="137" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">db-2</text>

  <!-- 1:1 Arrow Lines -->
  <line x1="404" y1="154" x2="404" y2="210" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="154" x2="500" y2="210" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="596" y1="154" x2="596" y2="210" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Dedicated PVCs -->
  <rect x="365" y="210" width="78" height="54" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="404" y="232" text-anchor="middle" font-size="11" font-weight="500" fill="#085041">data-db-0</text>
  <text x="404" y="250" text-anchor="middle" font-size="10" fill="#0F6E56">(전용 PVC)</text>

  <rect x="461" y="210" width="78" height="54" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="500" y="232" text-anchor="middle" font-size="11" font-weight="500" fill="#085041">data-db-1</text>
  <text x="500" y="250" text-anchor="middle" font-size="10" fill="#0F6E56">(전용 PVC)</text>

  <rect x="557" y="210" width="78" height="54" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="596" y="232" text-anchor="middle" font-size="11" font-weight="500" fill="#085041">data-db-2</text>
  <text x="596" y="250" text-anchor="middle" font-size="10" fill="#0F6E56">(전용 PVC)</text>

  <!-- Right Bottom Note -->
  <rect x="365" y="282" width="270" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="500" y="302" text-anchor="middle" font-size="11" font-weight="500" fill="#085041">파드 재시작 시 고정 전용 PVC 재연결</text>
  <text x="500" y="320" text-anchor="middle" font-size="11" fill="#0F6E56">DB 복제(Primary/Replica) 독립 데이터 유지</text>
</svg>
