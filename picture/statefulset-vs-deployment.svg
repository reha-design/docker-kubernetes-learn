<svg width="680" height="320" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>Deployment와 StatefulSet의 파드 차이</title>
  <desc>Deployment의 파드는 이름이 랜덤하고 전용 저장소가 없지만, StatefulSet의 파드는 이름이 고정되고 각자 자신만의 PVC를 가진다.</desc>
  <rect x="0" y="0" width="680" height="320" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Deployment -->
  <rect x="30" y="60" width="300" height="220" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="50" y="88" font-size="14" font-weight="500" fill="#444441">Deployment</text>
  <text x="50" y="108" font-size="12" fill="#5F5E5A">이름 랜덤 · 저장소 없음</text>

  <rect x="60" y="130" width="110" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="115" y="157" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">web-7f9d</text>

  <rect x="190" y="130" width="110" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="245" y="157" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">web-a3c1</text>

  <!-- StatefulSet -->
  <rect x="350" y="60" width="300" height="220" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="370" y="88" font-size="14" font-weight="500" fill="#444441">StatefulSet</text>
  <text x="370" y="108" font-size="12" fill="#5F5E5A">이름 고정 · 파드별 저장소</text>

  <rect x="380" y="130" width="100" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="430" y="157" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">db-0</text>
  <line x1="430" y1="174" x2="430" y2="184" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="380" y="184" width="100" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="430" y="206" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">db-0-pvc</text>

  <rect x="500" y="130" width="100" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="550" y="157" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">db-1</text>
  <line x1="550" y1="174" x2="550" y2="184" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="500" y="184" width="100" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="550" y="206" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">db-1-pvc</text>
</svg>
