<svg width="680" height="470" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>클라이언트 → Ingress → Service → Pod 트래픽 흐름과 Deployment의 역할</title>
  <desc>외부 요청은 Ingress, Service를 거쳐 Pod에 도달하고, Deployment는 이 흐름과 무관하게 Pod 개수만 관리한다.</desc>
  <rect x="0" y="0" width="680" height="470" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 클라이언트 -->
  <rect x="260" y="20" width="160" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="340" y="47" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">클라이언트</text>

  <line x1="340" y1="64" x2="340" y2="94" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Ingress -->
  <rect x="230" y="96" width="220" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="340" y="119" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Ingress</text>
  <text x="340" y="139" text-anchor="middle" font-size="12" fill="#0F6E56">정문 안내데스크 (바깥→안)</text>

  <line x1="340" y1="152" x2="340" y2="182" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Service -->
  <rect x="230" y="184" width="220" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="340" y="207" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Service</text>
  <text x="340" y="227" text-anchor="middle" font-size="12" fill="#0F6E56">부서 팻말 (고정 주소)</text>

  <line x1="340" y1="240" x2="340" y2="270" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Pods 컨테이너 -->
  <rect x="40" y="272" width="400" height="128" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="60" y="300" font-size="14" font-weight="500" fill="#444441">Pods</text>
  <text x="60" y="320" font-size="12" fill="#5F5E5A">실제로 일하는 프로그램</text>

  <rect x="70" y="336" width="100" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="120" y="363" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Pod</text>

  <rect x="190" y="336" width="100" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="240" y="363" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Pod</text>

  <rect x="310" y="336" width="100" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="360" y="363" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Pod</text>

  <!-- Deployment -->
  <rect x="480" y="304" width="150" height="64" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="555" y="330" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">Deployment</text>
  <text x="555" y="351" text-anchor="middle" font-size="12" fill="#5F5E5A">개수만 유지</text>

  <line x1="480" y1="336" x2="442" y2="336" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="460" y="292" text-anchor="middle" font-size="12" fill="#5F5E5A">개수 관리</text>

  <text x="340" y="440" text-anchor="middle" font-size="12" fill="#5F5E5A">실선 = 트래픽이 흐르는 길 · 점선 = 개수만 관리(트래픽과 무관)</text>
</svg>
