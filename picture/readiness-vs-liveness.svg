<svg width="680" height="284" viewBox="0 0 680 284" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>readinessProbe와 livenessProbe 실패 시 반응 차이</title>
  <desc>readiness 실패는 Service 엔드포인트에서 제외될 뿐 재시작은 없고, liveness 실패는 컨테이너가 재시작된다.</desc>
  <rect x="0" y="0" width="680" height="284" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="50" y="44" font-size="14" font-weight="500" fill="#2C2C2A">① readinessProbe 실패</text>

  <rect x="50" y="60" width="260" height="64" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="180" y="86" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">readiness 실패</text>
  <text x="180" y="107" text-anchor="middle" font-size="12" fill="#5F5E5A">/healthz 계속 404</text>
  <line x1="310" y1="92" x2="330" y2="92" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="330" y="60" width="260" height="64" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="460" y="86" text-anchor="middle" font-size="14" font-weight="500" fill="#633806">Service에서 제외</text>
  <text x="460" y="107" text-anchor="middle" font-size="12" fill="#854F0B">재시작 없음 (0회)</text>

  <text x="50" y="164" font-size="14" font-weight="500" fill="#2C2C2A">② livenessProbe 실패</text>

  <rect x="50" y="180" width="260" height="64" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="180" y="206" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">liveness 실패</text>
  <text x="180" y="227" text-anchor="middle" font-size="12" fill="#5F5E5A">/ 응답 403 ×3회</text>
  <line x1="310" y1="212" x2="330" y2="212" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="330" y="180" width="260" height="64" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="460" y="206" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">컨테이너 재시작</text>
  <text x="460" y="227" text-anchor="middle" font-size="12" fill="#993C1D">RESTARTS +1 (Killing)</text>
</svg>
