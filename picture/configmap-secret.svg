<svg width="680" height="330" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>ConfigMap과 Secret이 Pod에 주입되는 구조</title>
  <desc>ConfigMap은 일반 설정, Secret은 민감 정보를 담아 각각 Pod에 환경변수나 볼륨으로 주입된다. Secret은 base64 인코딩일 뿐 암호화가 아니다.</desc>
  <rect x="0" y="0" width="680" height="330" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="60" y="80" width="220" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="170" y="106" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">ConfigMap</text>
  <text x="170" y="127" text-anchor="middle" font-size="12" fill="#0F6E56">일반 설정값</text>

  <rect x="400" y="80" width="220" height="64" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="510" y="106" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Secret</text>
  <text x="510" y="127" text-anchor="middle" font-size="12" fill="#993C1D">민감 정보(비밀번호 등)</text>

  <line x1="200" y1="144" x2="300" y2="220" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="144" x2="380" y2="220" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="240" y="220" width="200" height="64" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="340" y="246" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Pod</text>
  <text x="340" y="267" text-anchor="middle" font-size="12" fill="#5F5E5A">환경변수/볼륨으로 주입</text>

  <text x="340" y="312" text-anchor="middle" font-size="12" font-weight="500" fill="#712B13">Secret은 base64 인코딩일 뿐, 암호화가 아니다</text>
</svg>
