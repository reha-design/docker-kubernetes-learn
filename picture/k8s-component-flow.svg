<svg width="720" height="520" viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>kubectl run 실행 시 컴포넌트 간 통신 흐름</title>
  <desc>kubectl이 API 서버에 Pod 생성을 요청하면, API 서버가 etcd에 기록하고, scheduler가 노드를 결정하며, kubelet이 컨테이너를 실행하는 순서를 보여준다. 모든 컴포넌트는 API 서버를 통해서만 통신한다.</desc>
  <rect x="0" y="0" width="720" height="520" fill="#FFFFFF"/>
  <defs>
    <marker id="arrowFlow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1A73E8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#2C2C2A">kubectl run 실행 시 컴포넌트 간 통신 흐름</text>

  <!-- kubectl (top left) -->
  <rect x="30" y="70" width="130" height="50" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="95" y="100" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">kubectl</text>

  <!-- Central: kube-apiserver (large, blue, prominent) -->
  <rect x="250" y="130" width="220" height="80" rx="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2"/>
  <text x="360" y="163" text-anchor="middle" font-size="14" font-weight="600" fill="#0D47A1">kube-apiserver</text>
  <text x="360" y="182" text-anchor="middle" font-size="11" fill="#1A73E8">모든 요청의 유일한 창구</text>

  <!-- etcd (right) -->
  <rect x="560" y="130" width="130" height="80" rx="10" fill="#FEF9C3" stroke="#A16207" stroke-width="1"/>
  <text x="625" y="163" text-anchor="middle" font-size="13" font-weight="500" fill="#713F12">etcd</text>
  <text x="625" y="182" text-anchor="middle" font-size="11" fill="#A16207">상태 저장소</text>

  <!-- kube-scheduler (bottom left) -->
  <rect x="60" y="290" width="170" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="145" y="320" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">kube-scheduler</text>
  <text x="145" y="340" text-anchor="middle" font-size="11" fill="#0F6E56">노드 배치 결정</text>

  <!-- kubelet (bottom right) -->
  <rect x="490" y="290" width="170" height="70" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="575" y="320" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">kubelet</text>
  <text x="575" y="340" text-anchor="middle" font-size="11" fill="#5F5E5A">컨테이너 실행</text>

  <!-- Step 1: kubectl → API server -->
  <line x1="160" y1="95" x2="245" y2="150" stroke="#1A73E8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <rect x="150" y="105" width="18" height="18" rx="9" fill="#1A73E8"/>
  <text x="159" y="118" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">1</text>
  <text x="220" y="108" font-size="10" fill="#1A73E8">"Pod 만들어줘"</text>

  <!-- Step 2: API server → etcd -->
  <line x1="470" y1="160" x2="555" y2="160" stroke="#A16207" stroke-width="1.5" marker-end="url(#arrowFlow)"/>
  <rect x="498" y="140" width="18" height="18" rx="9" fill="#A16207"/>
  <text x="507" y="153" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">2</text>
  <text x="510" y="132" font-size="10" fill="#A16207">기록</text>

  <!-- Step 3: scheduler ↔ API server (watching + writing) -->
  <line x1="230" y1="210" x2="145" y2="286" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrowFlow)"/>
  <line x1="170" y1="290" x2="270" y2="210" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrowFlow)" stroke-dasharray="5,3"/>
  <rect x="168" y="236" width="18" height="18" rx="9" fill="#0F6E56"/>
  <text x="177" y="249" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">3</text>
  <text x="120" y="260" font-size="10" fill="#0F6E56">새 Pod 감지</text>
  <text x="120" y="274" font-size="10" fill="#0F6E56">→ 노드 결정 → 기록</text>

  <!-- Step 4: kubelet ↔ API server -->
  <line x1="450" y1="210" x2="560" y2="286" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrowFlow)"/>
  <rect x="510" y="236" width="18" height="18" rx="9" fill="#5F5E5A"/>
  <text x="519" y="249" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">4</text>
  <text x="540" y="260" font-size="10" fill="#5F5E5A">배정된 Pod 감지</text>
  <text x="540" y="274" font-size="10" fill="#5F5E5A">→ 컨테이너 실행</text>

  <!-- Step 5: kubelet → API server → etcd (report) -->
  <line x1="530" y1="360" x2="420" y2="408" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrowFlow)" stroke-dasharray="5,3"/>
  <line x1="420" y1="405" x2="625" y2="405" stroke="#A16207" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="625" y1="405" x2="625" y2="215" stroke="#A16207" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrowFlow)"/>
  <rect x="460" y="380" width="18" height="18" rx="9" fill="#5F5E5A"/>
  <text x="469" y="393" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">5</text>
  <text x="410" y="375" font-size="10" fill="#5F5E5A">결과 보고 → etcd 반영</text>

  <!-- Key point at bottom -->
  <rect x="130" y="450" width="460" height="40" rx="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="360" y="475" text-anchor="middle" font-size="12" font-weight="600" fill="#0D47A1">모든 컴포넌트는 API 서버를 통해서만 통신한다</text>
</svg>