<svg width="720" height="570" viewBox="0 0 720 570" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>kubectl run 실행 시 컴포넌트 간 통신 흐름</title>
  <desc>kubectl이 API 서버에 Pod 생성을 요청하면, API 서버가 etcd에 기록하고, scheduler가 노드를 결정해 API 서버에 기록하며, kubelet이 컨테이너를 실행하고 결과를 다시 API 서버에 기록하는 순서를 보여준다. etcd로 가는 선은 API 서버에서 나오는 것 하나뿐이라, 모든 컴포넌트가 API 서버를 통해서만 통신한다는 것이 구조로 드러난다.</desc>
  <rect x="0" y="0" width="720" height="570" fill="#FFFFFF"/>
  <defs>
    <marker id="arrowFlow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1A73E8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A16207" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#2C2C2A">kubectl run 실행 시 컴포넌트 간 통신 흐름</text>
  <text x="360" y="48" text-anchor="middle" font-size="11" fill="#5F5E5A">실선 = 조회(watch)  ·  점선 = 기록(write)</text>

  <!-- kubectl (top) -->
  <rect x="280" y="65" width="160" height="50" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="360" y="96" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">kubectl</text>

  <!-- Central: kube-apiserver (large, blue, prominent) -->
  <rect x="220" y="230" width="280" height="80" rx="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2"/>
  <text x="360" y="263" text-anchor="middle" font-size="14" font-weight="600" fill="#0D47A1">kube-apiserver</text>
  <text x="360" y="282" text-anchor="middle" font-size="11" fill="#1A73E8">모든 요청의 유일한 창구</text>

  <!-- etcd (right, aligned with apiserver center) -->
  <rect x="550" y="235" width="130" height="70" rx="10" fill="#FEF9C3" stroke="#A16207" stroke-width="1"/>
  <text x="615" y="265" text-anchor="middle" font-size="13" font-weight="500" fill="#713F12">etcd</text>
  <text x="615" y="284" text-anchor="middle" font-size="11" fill="#A16207">상태 저장소</text>

  <!-- kube-scheduler (bottom left) -->
  <rect x="80" y="400" width="200" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="180" y="430" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">kube-scheduler</text>
  <text x="180" y="450" text-anchor="middle" font-size="11" fill="#0F6E56">노드 배치 결정</text>

  <!-- kubelet (bottom right, mirrored) -->
  <rect x="440" y="400" width="200" height="70" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="540" y="430" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">kubelet</text>
  <text x="540" y="450" text-anchor="middle" font-size="11" fill="#5F5E5A">컨테이너 실행</text>

  <!-- Step 1: kubectl -> API server -->
  <line x1="360" y1="115" x2="360" y2="226" stroke="#1A73E8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <circle cx="345" cy="168" r="9" fill="#1A73E8"/>
  <text x="345" y="172" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">1</text>
  <text x="360" y="172" font-size="10" fill="#1A73E8">Pod 생성 요청</text>

  <!-- Step 2: API server -> etcd (the ONLY line touching etcd) -->
  <line x1="500" y1="270" x2="545" y2="270" stroke="#A16207" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <text x="522" y="255" text-anchor="middle" font-size="10" fill="#A16207">2</text>
  <text x="522" y="300" text-anchor="middle" font-size="9" fill="#A16207">기록</text>

  <!-- Step 3: scheduler <-> API server, two parallel (non-crossing) lines -->
  <line x1="270" y1="310" x2="160" y2="400" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrowTeal)"/>
  <line x1="220" y1="400" x2="330" y2="310" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowTeal)"/>
  <circle cx="245" cy="358" r="9" fill="#0F6E56"/>
  <text x="245" y="362" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">3</text>
  <text x="90" y="345" font-size="10" fill="#0F6E56">새 Pod 감지</text>
  <text x="90" y="360" font-size="10" fill="#0F6E56">→ 노드 결정 → 기록</text>

  <!-- Step 4: kubelet <-> API server, mirrored parallel lines -->
  <line x1="450" y1="310" x2="560" y2="400" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrowFlow)"/>
  <line x1="500" y1="400" x2="390" y2="310" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowFlow)"/>
  <circle cx="475" cy="358" r="9" fill="#5F5E5A"/>
  <text x="475" y="362" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">4</text>
  <text x="650" y="345" text-anchor="end" font-size="10" fill="#5F5E5A">배정된 Pod 감지</text>
  <text x="650" y="360" text-anchor="end" font-size="10" fill="#5F5E5A">→ 컨테이너 실행 → 기록</text>

  <!-- Key point at bottom -->
  <rect x="130" y="500" width="460" height="40" rx="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="360" y="525" text-anchor="middle" font-size="12" font-weight="600" fill="#0D47A1">모든 컴포넌트는 API 서버를 통해서만 통신한다</text>
</svg>
