<svg width="680" height="430" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif">
  <title>ServiceAccount — 파드 신원 인증과 RBAC 검사 흐름</title>
  <desc>파드가 시작되면 kubelet이 ServiceAccount 토큰을 자동 마운트하고, 파드는 이 토큰으로 API 서버에 요청하며, API 서버는 신원을 확인한 뒤 RBAC으로 권한을 검사해 허용 또는 거부한다.</desc>

  <rect x="0" y="0" width="680" height="430" fill="#FFFFFF"/>

  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 1. Pod -->
  <rect x="250" y="30" width="180" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="340" y="53" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">Pod</text>
  <text x="340" y="73" text-anchor="middle" font-size="12" fill="#185FA5">day9-sa 지정</text>

  <line x1="340" y1="86" x2="340" y2="126" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="352" y="110" font-size="11" fill="#5F5E5A">kubelet이 자동 마운트</text>

  <!-- 2. projected volume -->
  <rect x="210" y="130" width="260" height="56" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="340" y="153" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">projected volume</text>
  <text x="340" y="173" text-anchor="middle" font-size="11" fill="#5F5E5A">ca.crt / token / namespace</text>

  <line x1="340" y1="186" x2="340" y2="226" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="352" y="210" font-size="11" fill="#5F5E5A">Authorization 헤더로 전송</text>

  <!-- 3. API 서버 -->
  <rect x="190" y="230" width="300" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="340" y="253" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">API 서버</text>
  <text x="340" y="273" text-anchor="middle" font-size="11" fill="#185FA5">system:serviceaccount:day9-ns:day9-sa</text>

  <line x1="340" y1="286" x2="340" y2="326" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="352" y="310" font-size="11" fill="#5F5E5A">RBAC 검사 (RoleBinding 확인)</text>

  <!-- 4. 결과 분기 -->
  <line x1="340" y1="326" x2="255" y2="330" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="340" y1="326" x2="425" y2="330" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <rect x="190" y="330" width="130" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="255" y="353" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">허용</text>
  <text x="255" y="373" text-anchor="middle" font-size="11" fill="#0F6E56">RoleBinding 있음</text>

  <rect x="360" y="330" width="130" height="56" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
  <text x="425" y="353" text-anchor="middle" font-size="13" font-weight="500" fill="#791F1F">거부</text>
  <text x="425" y="373" text-anchor="middle" font-size="11" fill="#A32D2D">RoleBinding 없음</text>
</svg>
